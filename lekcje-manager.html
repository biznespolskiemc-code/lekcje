<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administracyjny — Lekcje</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(40, 120, 255, .12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(0, 180, 255, .08), transparent 35%),
                #070b12;
            color: white;
            min-height: 100vh;
        }

        nav {
            height: 76px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 30px;
            background: rgba(7, 11, 18, .78);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        nav .logo {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: .5px;
        }

        .manager-page {
            max-width: 1100px;
            margin: auto;
            padding: 105px 20px 80px;
        }

        .hero-label {
            color: #4ea1ff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 800;
        }

        .subtitle {
            color: #8c98aa;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(15, 22, 34, .72);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            backdrop-filter: blur(15px);
            margin-bottom: 22px;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 20px;
        }

        input,
        textarea {
            width: 100%;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 11px;
            color: white;
            padding: 13px 14px;
            outline: none;
            font-family: inherit;
            transition: .2s;
        }

        input:focus,
        textarea:focus {
            border-color: rgba(78,161,255,.7);
            box-shadow: 0 0 0 3px rgba(78,161,255,.08);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        label {
            display: block;
            color: #aeb8c8;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .field {
            margin-bottom: 15px;
        }

        button {
            border: 0;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            border-radius: 10px;
            padding: 11px 15px;
            transition: .2s;
        }

        .primary {
            background: #398cff;
            color: white;
        }

        .primary:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .secondary {
            background: rgba(255,255,255,.07);
            color: #dce5f2;
            border: 1px solid rgba(255,255,255,.08);
        }

        .secondary:hover {
            background: rgba(255,255,255,.11);
        }

        .danger {
            background: rgba(255,70,70,.12);
            color: #ff7777;
            border: 1px solid rgba(255,70,70,.15);
        }

        .danger:hover {
            background: rgba(255,70,70,.2);
        }

        .login-panel {
            max-width: 500px;
            margin: 120px auto 0;
        }

        .manager {
            display: none;
        }

        .lesson {
            position: relative;
            padding: 20px;
            border-radius: 16px;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.07);
            margin-bottom: 15px;
        }

        .lesson-number {
            color: #4ea1ff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .lesson-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 13px;
        }

        .lesson-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 13px;
        }

        .attachments {
            margin-top: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .attachment {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .attachment input {
            flex: 1;
        }

        .saved-day {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 16px;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 14px;
            margin-bottom: 10px;
        }

        .saved-day-date {
            font-weight: 700;
        }

        .saved-day-info {
            color: #8793a6;
            font-size: 12px;
            margin-top: 5px;
        }

        .saved-day-actions {
            display: flex;
            gap: 7px;
        }

        .status {
            margin-top: 15px;
            color: #8d9aae;
            font-size: 13px;
        }

        .empty {
            color: #758195;
            padding: 10px 0;
        }

        @media (max-width: 650px) {
            nav {
                height: 68px;
                padding: 0 17px;
            }

            .manager-page {
                padding: 90px 15px 60px;
            }

            h1 {
                font-size: 28px;
            }

            .panel {
                padding: 17px;
                border-radius: 16px;
            }

            .saved-day {
                align-items: flex-start;
                flex-direction: column;
            }

            .saved-day-actions {
                width: 100%;
            }

            .saved-day-actions button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">LEKCJE</div>
</nav>

<div id="loginPanel" class="login-panel panel">
    <div class="hero-label">PANEL ADMINISTRACYJNY</div>

    <h1>Zaloguj się</h1>

    <p class="subtitle">
        Podaj token administratora, aby zarządzać lekcjami.
    </p>

    <div class="field">
        <label>Token administratora</label>
        <input
            type="password"
            id="token"
            placeholder="Wpisz ADMIN_TOKEN"
        >
    </div>

    <button class="primary" onclick="login()">
        Zaloguj
    </button>

    <div id="loginStatus" class="status"></div>
</div>


<div id="manager" class="manager">

    <main class="manager-page">

        <div class="hero-label">PANEL ADMINISTRACYJNY</div>

        <h1>Zarządzanie lekcjami</h1>

        <p class="subtitle">
            Dodawaj lekcje, materiały i zdjęcia przypisane do konkretnych zajęć.
        </p>


        <section class="panel">

            <h2>Nowy dzień</h2>

            <div class="field">
                <label>Data</label>

                <input
                    type="date"
                    id="date"
                    onchange="handleDateChange()"
                >
            </div>

            <div id="lessonsContainer"></div>

            <button class="secondary" onclick="addLesson()">
                + Dodaj lekcję
            </button>

            <div style="height: 15px;"></div>

            <button class="primary" onclick="saveDay()">
                💾 Zapisz dzień
            </button>

            <div id="saveStatus" class="status"></div>

        </section>


        <section class="panel">

            <h2>Zapisane dni</h2>

            <div id="savedDays">
                <div class="empty">Ładowanie...</div>
            </div>

        </section>

    </main>

</div>


<script>

const API = "https://old-term-d35c.oliwierbielicki.workers.dev";

let ADMIN_TOKEN = "";
let savedDaysData = [];


/* =========================
   PLAN LEKCJI
========================= */

const WEEKDAY_SCHEDULES = {

    1: [
        "Chemia",
        "Wiedza o społeczeństwie",
        "Matematyka",
        "J. Niemiecki (grupa 1)",
        "J. Polski",
        "J. Angielski (grupa 1)",
        "Edukacja dla bezpieczeństwa"
    ],

    2: [
        "J. Niemiecki (grupa 1)",
        "J. Polski",
        "J. Polski",
        "Biologia",
        "Historia",
        "Matematyka",
        "Religia"
    ],

    3: [
        "Wiedza o społeczeństwie",
        "J. Angielski (grupa 1)",
        "W-F",
        "W-F",
        "Matematyka",
        "Informatyka (grupa 1)",
        "Edukacja zdrowotna",
        "Geografia"
    ],

    4: [
        "Historia",
        "Godzina wychowawcza",
        "J. Polski",
        "Chemia",
        "Fizyka",
        "J. Angielski (grp1)",
        "J. Angielski (grp1)"
    ],

    5: [
        "Matematyka",
        "Matematyka",
        "Fizyka",
        "J. Polski",
        "J. Polski",
        "W-F",
        "W-F"
    ]

};


function getWeekdayIndex(dateString) {

    if (!dateString) return null;

    const parts = dateString.split("-");

    const date = new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );

    const day = date.getDay();

    return day === 0 ? 7 : day;
}


function getScheduleForDate(dateString) {

    const day = getWeekdayIndex(dateString);

    return WEEKDAY_SCHEDULES[day] || [];
}


function getTodayLocal() {

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* =========================
   LOGOWANIE
========================= */

function login() {

    const tokenInput = document.getElementById("token");
    const status = document.getElementById("loginStatus");

    ADMIN_TOKEN = tokenInput.value.trim();

    if (!ADMIN_TOKEN) {

        status.textContent = "Wpisz token.";
        return;
    }

    document.getElementById("loginPanel").style.display = "none";
    document.getElementById("manager").style.display = "block";

    const dateInput = document.getElementById("date");

    dateInput.value = getTodayLocal();

    fillDefaultLessons();

    loadSavedDays();
}


/* =========================
   LEKCJE
========================= */

function fillDefaultLessons() {

    const container = document.getElementById("lessonsContainer");

    container.innerHTML = "";

    const schedule = getScheduleForDate(
        document.getElementById("date").value
    );

    if (!schedule.length) {

        addLesson("", "");

        return;
    }

    schedule.forEach(subject => {

        addLesson(subject, "");

    });
}


function handleDateChange() {

    const date = document.getElementById("date").value;

    if (!date) {

        document.getElementById("lessonsContainer").innerHTML = "";

        addLesson("", "");

        return;
    }

    fillDefaultLessons();

    const schedule = getScheduleForDate(date);

    const dayNames = [
        "",
        "poniedziałek",
        "wtorek",
        "środa",
        "czwartek",
        "piątek",
        "sobota",
        "niedziela"
    ];

    const day = getWeekdayIndex(date);

    document.getElementById("saveStatus").textContent =
        schedule.length
            ? `${dayNames[day]} — domyślnie ${schedule.length} lekcji.`
            : `${dayNames[day]} — brak domyślnego planu.`;
}


function addLesson(subject = undefined, content = "", attachments = []) {

    const container = document.getElementById("lessonsContainer");

    const lessonIndex = container.children.length;

    /*
        Jeżeli nie podano przedmiotu,
        pobierz go automatycznie z planu.
    */

    if (subject === undefined) {

        const schedule = getScheduleForDate(
            document.getElementById("date").value
        );

        subject = schedule[lessonIndex] || "";

    }


    const lesson = document.createElement("div");

    lesson.className = "lesson";

    lesson.innerHTML = `

        <div class="lesson-number">
            LEKCJA ${lessonIndex + 1}
        </div>

        <div class="lesson-grid">

            <div class="field">

                <label>Przedmiot</label>

                <input
                    class="lesson-subject"
                    type="text"
                    value="${escapeAttribute(subject)}"
                    placeholder="np. Matematyka"
                >

            </div>

            <div class="field">

                <label>Co było na lekcji?</label>

                <textarea
                    class="lesson-content"
                    placeholder="Wpisz, co było na lekcji..."
                >${escapeHtml(content)}</textarea>

            </div>

        </div>

        <div class="lesson-actions">

            <button
                type="button"
                class="secondary"
                onclick="addAttachment(this)"
            >
                📎 Dodaj załącznik
            </button>

            <button
                type="button"
                class="danger"
                onclick="removeLesson(this)"
            >
                🗑 Usuń lekcję
            </button>

        </div>

        <div class="attachments"></div>
    `;


    container.appendChild(lesson);


    const attachmentContainer =
        lesson.querySelector(".attachments");


    attachments.forEach(file => {

        createAttachment(
            attachmentContainer,
            file.name || "",
            file.url || ""
        );

    });


    updateLessonNumbers();
}


function removeLesson(button) {

    const lesson = button.closest(".lesson");

    lesson.remove();

    updateLessonNumbers();
}


function updateLessonNumbers() {

    document
        .querySelectorAll("#lessonsContainer .lesson")
        .forEach((lesson, index) => {

            const number =
                lesson.querySelector(".lesson-number");

            number.textContent =
                `LEKCJA ${index + 1}`;

        });
}


/* =========================
   ZAŁĄCZNIKI
========================= */

function addAttachment(button) {

    const lesson = button.closest(".lesson");

    const container =
        lesson.querySelector(".attachments");

    createAttachment(container, "", "");
}


function createAttachment(container, name, url) {

    const attachment = document.createElement("div");

    attachment.className = "attachment";

    attachment.innerHTML = `

        <input
            type="text"
            class="attachment-name"
            placeholder="Nazwa, np. Zdjęcie z tablicy"
            value="${escapeAttribute(name)}"
        >

        <input
            type="url"
            class="attachment-url"
            placeholder="Bezpośredni link do zdjęcia"
            value="${escapeAttribute(url)}"
        >

        <button
            type="button"
            class="danger"
            onclick="this.parentElement.remove()"
        >
            ✕
        </button>
    `;

    container.appendChild(attachment);
}


/* =========================
   ZAPIS
========================= */

async function saveDay() {

    const date = document.getElementById("date").value;

    const status = document.getElementById("saveStatus");

    if (!date) {

        status.textContent = "Wybierz datę.";
        return;
    }


    const lessons = [];


    document
        .querySelectorAll("#lessonsContainer .lesson")
        .forEach(lesson => {

            const subject =
                lesson.querySelector(".lesson-subject").value.trim();

            const content =
                lesson.querySelector(".lesson-content").value.trim();


            const attachments = [];


            lesson
                .querySelectorAll(".attachment")
                .forEach(file => {

                    const name =
                        file.querySelector(".attachment-name")
                            .value
                            .trim();

                    const url =
                        file.querySelector(".attachment-url")
                            .value
                            .trim();


                    if (url) {

                        attachments.push({
                            name: name || "Załącznik",
                            url: url
                        });

                    }

                });


            lessons.push({

                subject: subject,

                content: content,

                attachments: attachments

            });

        });


    status.textContent = "Zapisywanie...";


    try {

        const response = await fetch(
            `${API}/lessons`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${ADMIN_TOKEN}`
                },

                body: JSON.stringify({

                    date: date,

                    lessons: lessons,

                    /*
                       files pozostawiamy dla zgodności
                       z obecną bazą.
                    */

                    files: []

                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Nie udało się zapisać."
            );

        }


        status.textContent =
            "✓ Dzień został zapisany.";


        loadSavedDays();


    } catch (error) {

        status.textContent =
            "Błąd: " + error.message;

    }

}


/* =========================
   WCZYTYWANIE DNI
========================= */

async function loadSavedDays() {

    const container =
        document.getElementById("savedDays");


    try {

        const response =
            await fetch(`${API}/lessons`);


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Błąd pobierania."
            );

        }


        savedDaysData = data;

        renderSavedDays();


    } catch (error) {

        container.innerHTML =
            `<div class="empty">
                Błąd: ${escapeHtml(error.message)}
            </div>`;

    }

}


function renderSavedDays() {

    const container =
        document.getElementById("savedDays");


    if (!savedDaysData.length) {

        container.innerHTML =
            `<div class="empty">
                Nie ma jeszcze zapisanych dni.
            </div>`;

        return;
    }


    container.innerHTML = "";


    [...savedDaysData]
        .sort((a, b) =>
            a.date.localeCompare(b.date)
        )
        .forEach(day => {

            const div =
                document.createElement("div");

            div.className = "saved-day";


            const count =
                Array.isArray(day.lessons)
                    ? day.lessons.length
                    : 0;


            div.innerHTML = `

                <div>

                    <div class="saved-day-date">
                        ${escapeHtml(formatDate(day.date))}
                    </div>

                    <div class="saved-day-info">
                        ${getWeekdayName(day.date)}
                        — ${count} ${lessonWord(count)}
                    </div>

                </div>

                <div class="saved-day-actions">

                    <button
                        class="secondary"
                        onclick="editDay('${escapeAttribute(day.date)}')"
                    >
                        ✏️ Edytuj
                    </button>

                    <button
                        class="danger"
                        onclick="deleteDay('${escapeAttribute(day.date)}')"
                    >
                        🗑 Usuń
                    </button>

                </div>
            `;


            container.appendChild(div);

        });

}


/* =========================
   EDYCJA
========================= */

function editDay(date) {

    const day =
        savedDaysData.find(item => item.date === date);


    if (!day) return;


    document.getElementById("date").value =
        date;


    const container =
        document.getElementById("lessonsContainer");


    container.innerHTML = "";


    (day.lessons || []).forEach(lesson => {

        addLesson(
            lesson.subject || "",
            lesson.content || "",
            lesson.attachments || []
        );

    });


    if (!day.lessons || !day.lessons.length) {

        addLesson("", "");

    }


    document.getElementById("saveStatus").textContent =
        "Edytujesz dzień " + formatDate(date);


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   USUWANIE
========================= */

async function deleteDay(date) {

    if (!confirm(
        `Czy na pewno chcesz usunąć ${formatDate(date)}?`
    )) {

        return;
    }


    try {

        const response =
            await fetch(
                `${API}/lessons/${encodeURIComponent(date)}`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            `Bearer ${ADMIN_TOKEN}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Nie udało się usunąć."
            );

        }


        document.getElementById("saveStatus").textContent =
            "✓ Dzień został usunięty.";


        loadSavedDays();


    } catch (error) {

        document.getElementById("saveStatus").textContent =
            "Błąd: " + error.message;

    }

}


/* =========================
   FUNKCJE POMOCNICZE
========================= */

function formatDate(dateString) {

    const [year, month, day] =
        dateString.split("-");


    const date =
        new Date(
            Number(year),
            Number(month) - 1,
            Number(day)
        );


    return date.toLocaleDateString(
        "pl-PL",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


function getWeekdayName(dateString) {

    const index =
        getWeekdayIndex(dateString);


    const names = [
        "",
        "poniedziałek",
        "wtorek",
        "środa",
        "czwartek",
        "piątek",
        "sobota",
        "niedziela"
    ];


    return names[index] || "";

}


function lessonWord(count) {

    if (count === 1) return "lekcja";

    if (
        count >= 2 &&
        count <= 4
    ) {
        return "lekcje";
    }

    return "lekcji";

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHtml(value);

}

</script>

</body>
</html>
