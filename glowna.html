<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LEKCJE | Strona główna</title>

    <meta
        name="description"
        content="Lekcje"
    >

    <link
        rel="icon"
        type="image/png"
        href="Polak.png"
    >

    <link
        rel="stylesheet"
        href="style-glowna.css"
    >

</head>


<body>


    <!-- =====================================================
         TŁO
    ====================================================== -->

    <div class="background">

        <div class="background-glow glow-one"></div>

        <div class="background-glow glow-two"></div>

        <div class="grid"></div>

    </div>



    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="navbar">

        <div class="nav-container">


            <!-- LOGO -->

            <a
                href="glowna.html"
                class="logo"
            >
                LEKCJE
            </a>



            <!-- HAMBURGER -->

            <div
                class="hamburger"
                id="hamburger"
                aria-label="Menu"
                aria-expanded="false"
            >

                <span></span>

                <span></span>

                <span></span>

            </div>



            <!-- MENU -->

            <div
                class="menu"
                id="menu"
            >

                <a
                    href="glowna.html"
                    class="active"
                >
                    Strona główna
                </a>

                <a href="lekcje.html">
                    Lekcje
                </a>

            </div>


        </div>

    </nav>



    <!-- =====================================================
         GŁÓWNA ZAWARTOŚĆ
    ====================================================== -->

    <main>


        <section class="hero">


            <div class="hero-container">


                <div class="hero-content">


                    <!-- LABEL -->

                    <div class="hero-label">

                        <span></span>

                        LEKCJE

                    </div>



                    <!-- TYTUŁ -->

                    <h1>
                        Strona główna
                    </h1>



                    <!-- OPIS -->

                    <p>
                        Ze względu na to, że dużo łatwiej jest mi tutaj
                        cokolwiek dodawać niż na Messengerze, zrobiłem
                        szybką stronę.
                    </p>



                    <!-- PRZYCISK -->

                    <div class="hero-buttons">

                        <a
                            href="lekcje.html"
                            class="primary-button"
                        >

                            <span class="button-text">
                                LISTA LEKCJI
                            </span>

                            <span class="button-arrow">
                                →
                            </span>

                        </a>

                    </div>

                    <div class="hero-buttons2">

                        <a
                            href="e8.html"
                            class="primary-button"
                        >

                            <span class="button-text">
                                EGZAMIN ÓSMOKLASISTY
                            </span>

                            <span class="button-arrow">
                                →
                            </span>

                        </a>

                    </div>


                </div>


            </div>


        </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <div class="footer-container">

            <strong>
                LEKCJE
            </strong>

            <span>
                © 2026 — Panel lekcji
            </span>

        </div>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
         Jest tutaj, więc NIE potrzebujesz script.js
    ====================================================== -->

    <script>

        const hamburger =
            document.getElementById('hamburger');

        const menu =
            document.getElementById('menu');


        /* =================================================
           OTWIERANIE / ZAMYKANIE MENU
        ================================================= */

        hamburger.addEventListener('click', () => {

            hamburger.classList.toggle('active');

            menu.classList.toggle('active');


            const menuIsOpen =
                menu.classList.contains('active');


            hamburger.setAttribute(
                'aria-expanded',
                menuIsOpen ? 'true' : 'false'
            );

        });



        /* =================================================
           ZAMYKANIE MENU PO KLIKNIĘCIU W LINK
        ================================================= */

        document
            .querySelectorAll('.menu a')
            .forEach(link => {

                link.addEventListener('click', () => {

                    hamburger.classList.remove('active');

                    menu.classList.remove('active');

                    hamburger.setAttribute(
                        'aria-expanded',
                        'false'
                    );

                });

            });



        /* =================================================
           ZAMYKANIE MENU PO POWROCIE NA DESKTOP
        ================================================= */

        window.addEventListener('resize', () => {

            if (window.innerWidth > 700) {

                hamburger.classList.remove('active');

                menu.classList.remove('active');

                hamburger.setAttribute(
                    'aria-expanded',
                    'false'
                );

            }

        });


    </script>


</body>

</html>
