<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LEKCJE | Logowanie</title>

    <link rel="icon" href="Polak.png">
    <link rel="stylesheet" href="style-login.css">
</head>

<body>

    <!-- TŁO -->
    <div class="background">
        <div class="glow glow-left"></div>
        <div class="glow glow-right"></div>
        <div class="grid"></div>
    </div>

    <!-- LOGOWANIE -->
    <main class="login-page">

        <div class="login-card">

            <div class="login-top">
                <a class="logo">LEKCJE</a>

                <div class="login-label">
                    <span></span>
                    SYSTEM WERYFIKACJI
                </div>
            </div>

            <div class="login-header">
                <h1>Witaj ponownie.</h1>

                <p>
                    Wprowadź hasło, aby kontynuować.
                </p>
            </div>

            <form id="loginForm">

                <div class="input-group">

                    <label for="password">
                        HASŁO
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Wpisz hasło (dostępne na grupie)"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Pokaż hasło"
                        >
                            <svg
                                class="eye eye-open"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    d="M2.5 12C2.5 12 6 5.5 12 5.5C18 5.5 21.5 12 21.5 12C21.5 12 18 18.5 12 18.5C6 18.5 2.5 12 2.5 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />
                            </svg>

                            <svg
                                class="eye eye-closed"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    d="M3 3L21 21"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M10.6 5.8C11.05 5.7 11.52 5.65 12 5.65C18 5.65 21.5 12 21.5 12C21.5 12 20.1 14.55 17.7 16.35"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M6.3 7.65C3.9 9.45 2.5 12 2.5 12C2.5 12 6 18.35 12 18.35C13.35 18.35 14.55 18.1 15.6 17.65"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                />
                            </svg>
                        </button>

                    </div>

                </div>

                <button type="submit" class="login-button">
                    <span>ZALOGUJ SIĘ</span>
                    <span class="arrow">→</span>
                </button>

                <div id="loginMessage" class="login-message"></div>

            </form>

        </div>

    </main>


<script>
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");
    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("loginMessage");
    const submitButton = loginForm.querySelector(
        'button[type="submit"]'
    );

    const allowedPages = new Set([
        "/glowna.html",
        "/lekcje.html",
        "/lekcje-manager.html",
        "/e8.html"
    ]);

    function showMessage(message, type = "error") {
        loginMessage.textContent = message;
        loginMessage.className = `login-message ${type}`;
    }

    function getDestination() {
        const params = new URLSearchParams(location.search);
        const next = params.get("next");

        if (!next) return "/glowna.html";

        try {
            const destination = new URL(next, location.origin);

            if (
                destination.origin === location.origin &&
                allowedPages.has(destination.pathname)
            ) {
                return destination.pathname + destination.search;
            }
        } catch {
            // Nieprawidłowy adres.
        }

        return "/glowna.html";
    }

    if (
        new URLSearchParams(location.search).get("reason") ===
        "expired"
    ) {
        showMessage("Sesja wygasła. Zaloguj się ponownie.");
    }

    // Pokaż / ukryj hasło.
    passwordToggle.addEventListener("click", () => {
        const show = passwordInput.type === "password";

        passwordInput.type = show ? "text" : "password";
        passwordToggle.classList.toggle("visible", show);

        passwordToggle.setAttribute(
            "aria-label",
            show ? "Ukryj hasło" : "Pokaż hasło"
        );
    });

    // Logowanie po stronie serwera.
    loginForm.addEventListener("submit", async event => {
        event.preventDefault();

        const password = passwordInput.value;

        if (!password) {
            showMessage("Wpisz hasło.");
            return;
        }

        submitButton.disabled = true;
        showMessage("Sprawdzanie hasła...");

        try {
            const response = await fetch("/api/login", {
                method: "POST",
                credentials: "same-origin",
                cache: "no-store",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ password })
            });

            if (response.status === 401) {
                showMessage("Nieprawidłowe hasło.");
                passwordInput.value = "";
                passwordInput.focus();
                return;
            }

            if (!response.ok) {
                throw new Error("Błąd logowania");
            }

            const result = await response.json();

            if (result.ok !== true) {
                throw new Error("Niepotwierdzone logowanie");
            }

            showMessage("Logowanie pomyślne.", "success");

            location.replace(getDestination());

        } catch {
            showMessage(
                "Nie można połączyć się z serwerem logowania."
            );
        } finally {
            submitButton.disabled = false;
        }
    });

    // Efekt zaznaczenia pola hasła.
    passwordInput.addEventListener("focus", () => {
        passwordInput.parentElement.classList.add("focused");
    });

    passwordInput.addEventListener("blur", () => {
        passwordInput.parentElement.classList.remove("focused");
    });
</script>

</body>
</html>
