<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEKCJE | Lista lekcji</title>
    <meta name="description" content="Lista lekcji i materiały ze szkoły.">
    <link rel="icon" type="image/png" href="Polak.png">
    <link rel="stylesheet" href="style-lekcje.css">
</head>
<body>
    <div class="background">
        <div class="background-glow glow-one"></div>
        <div class="background-glow glow-two"></div>
        <div class="grid"></div>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="glowna.html" class="logo">LEKCJE</a>

            <div
                class="hamburger"
                id="hamburger"
                aria-label="Menu"
                aria-expanded="false"
                role="button"
                tabindex="0"
            >
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="menu" id="menu">
                <a href="glowna.html">Strona główna</a>
                <a href="lekcje.html" class="active">Lekcje</a>
                <a href="e8.html">Inne</a>
            </div>
        </div>
    </nav>

    <main>
        <section class="lessons-page">
            <div class="lessons-header">
                <h1>Lista <strong>lekcji.</strong></h1>
                <p>
                    Tutaj znajdziesz zapis tego, co danego dnia
                    było robione w szkole, wraz z dodatkowymi
                    materiałami i zdjęciami.
                </p>
            </div>

            <div class="sort-container" id="sortContainer">
                <button
                    type="button"
                    class="sort-button"
                    id="sortButton"
                    aria-expanded="false"
                    aria-controls="sortMenu"
                >
                    <span>
                        Sortuj wg.
                        <strong id="sortCurrent">Najnowsze</strong>
                    </span>
                    <span class="sort-arrow">▼</span>
                </button>

                <div class="sort-menu" id="sortMenu">
                    <div class="sort-group-label">
                        Data utworzenia:
                    </div>

                    <div class="sort-date-options">
                        <button type="button" data-sort="newest">
                            Najnowsze
                        </button>
                        <button type="button" data-sort="oldest">
                            Najstarsze
                        </button>
                    </div>

                    <div class="sort-divider"></div>

                    <div class="sort-group-label sort-month-label">
                        Miesiąc:
                    </div>

                    <div class="sort-months" id="sortMonths"></div>

                    <div class="sort-divider"></div>

                    <div class="sort-group-label">
                        Przedmiot:
                    </div>

                    <div class="sort-subjects" id="sortSubjects"></div>
                </div>
            </div>

            <div id="daysView">
                <div id="daysList">
                    <div class="loading">Ładowanie lekcji...</div>
                </div>
            </div>

            <div id="dayDetails">
                <button
                    class="back-button"
                    onclick="showDays()"
                    type="button"
                >
                    ← Powrót
                </button>

                <div class="details-header">
                    <div class="date-label" id="detailDate"></div>
                    <div class="weekday-label" id="detailWeekday"></div>
                    <h2>Lekcje</h2>
                </div>

                <div class="lessons-box">
                    <div id="lessonList"></div>

                    <div class="materials" id="materials">
                        <div class="materials-title">Materiały</div>
                        <div id="photoGallery" class="photo-gallery"></div>
                        <div id="materialsList" class="materials-list"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="imageViewer" aria-hidden="true">
        <div class="image-counter" id="imageCounter">1/1</div>

        <button
            class="image-close"
            onclick="closeImage()"
            aria-label="Zamknij"
            type="button"
        >
            ×
        </button>

        <button
            class="image-nav image-prev"
            id="imagePrev"
            onclick="previousImage(event)"
            aria-label="Poprzednie zdjęcie"
            type="button"
        >
            &lt;
        </button>

        <img id="viewerImage" src="" alt="Podgląd zdjęcia">

        <button
            class="image-nav image-next"
            id="imageNext"
            onclick="nextImage(event)"
            aria-label="Następne zdjęcie"
            type="button"
        >
            &gt;
        </button>
    </div>

    <footer>
        <div class="footer-container">
            <strong>LEKCJE</strong>
            <span>© 2026 — Archiwum lekcji</span>
        </div>
    </footer>

    <script>
        const API =
            "https://old-term-d35c.oliwierbielicki.workers.dev";

        let allDays = [];
        let currentSort = "newest";

        let viewerImages = [];
        let currentImageIndex = 0;

        const WEEK_DAYS = {
            0: "niedziela",
            1: "poniedziałek",
            2: "wtorek",
            3: "środa",
            4: "czwartek",
            5: "piątek",
            6: "sobota"
        };

        const MONTHS = [
            "",
            "STYCZEŃ",
            "LUTY",
            "MARZEC",
            "KWIECIEŃ",
            "MAJ",
            "CZERWIEC",
            "LIPIEC",
            "SIERPIEŃ",
            "WRZESIEŃ",
            "PAŹDZIERNIK",
            "LISTOPAD",
            "GRUDZIEŃ"
        ];

        const sortContainer =
            document.getElementById("sortContainer");

        const sortButton =
            document.getElementById("sortButton");

        const sortMenu =
            document.getElementById("sortMenu");

        const sortCurrent =
            document.getElementById("sortCurrent");

        const sortMonths =
            document.getElementById("sortMonths");

        const sortSubjects =
            document.getElementById("sortSubjects");

        loadLessons();

        async function loadLessons() {
            const container =
                document.getElementById("daysList");

            try {
                const response =
                    await fetch(`${API}/lessons`);

                if (!response.ok) {
                    throw new Error(
                        "Nie udało się pobrać lekcji."
                    );
                }

                const data = await response.json();

                allDays = Array.isArray(data) ? data : [];

                generateMonthOptions();
                generateSubjectOptions();
                applySort();
                syncSelectedSort();

            } catch (error) {
                container.innerHTML = `
                    <div class="empty">
                        Nie udało się pobrać listy lekcji.
                        <br><br>
                        ${escapeHtml(error.message)}
                    </div>
                `;
            }
        }

        sortButton.addEventListener("click", event => {
            event.stopPropagation();

            const isOpen =
                sortMenu.classList.toggle("active");

            sortButton.classList.toggle("active", isOpen);

            sortButton.setAttribute(
                "aria-expanded",
                isOpen ? "true" : "false"
            );
        });

        document.addEventListener("click", event => {
            if (
                !sortMenu.contains(event.target) &&
                !sortButton.contains(event.target)
            ) {
                closeSortMenu();
            }
        });

        sortMenu
            .querySelectorAll(
                'button[data-sort="newest"], button[data-sort="oldest"]'
            )
            .forEach(button => {
                button.addEventListener("click", () => {
                    currentSort = button.dataset.sort;

                    sortCurrent.textContent =
                        button.textContent.trim();

                    updateSelectedSort(button);
                    applySort();
                    closeSortMenu();
                });
            });

        function generateMonthOptions() {
            sortMonths.innerHTML = "";

            const months = new Map();

            allDays.forEach(day => {
                if (!day || !day.date) {
                    return;
                }

                const [year, month] =
                    String(day.date).split("-");

                if (!year || !month) {
                    return;
                }

                const key = `${year}-${month}`;

                if (!months.has(key)) {
                    months.set(key, {
                        year: Number(year),
                        month: Number(month)
                    });
                }
            });

            const sortedMonths =
                [...months.values()].sort((a, b) => {
                    if (a.year !== b.year) {
                        return b.year - a.year;
                    }

                    return b.month - a.month;
                });

            sortedMonths.forEach(item => {
                const button =
                    document.createElement("button");

                button.type = "button";

                button.dataset.sort =
                    `${item.year}-${String(item.month).padStart(2, "0")}`;

                button.textContent =
                    `${MONTHS[item.month] || ""} ${item.year}`;

                button.addEventListener("click", () => {
                    currentSort = button.dataset.sort;
                    sortCurrent.textContent = button.textContent;

                    updateSelectedSort(button);
                    applySort();
                    closeSortMenu();
                });

                sortMonths.appendChild(button);
