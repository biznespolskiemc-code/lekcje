<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LEKCJE | Lista lekcji</title>

    <meta
        name="description"
        content="Lista lekcji i materiały ze szkoły."
    >

    <link
        rel="icon"
        type="image/png"
        href="Polak.png"
    >

    <link
        rel="stylesheet"
        href="style-lekcje.css"
    >

</head>

<body>

<!-- =====================================================
     TŁO
===================================================== -->

<div class="background">

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>
    <div class="grid"></div>

</div>


<!-- =====================================================
     NAWIGACJA
===================================================== -->

<nav class="navbar">

    <div class="nav-container">

        <a
            href="glowna.html"
            class="logo"
        >
            LEKCJE
        </a>


        <!-- HAMBURGER -->

        <div
            class="hamburger"
            id="hamburger"
            aria-label="Menu"
            aria-expanded="false"
            role="button"
            tabindex="0"
        >

            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- MENU -->

        <div
            class="menu"
            id="menu"
        >

            <a href="glowna.html">
                Strona główna
            </a>

            <a
                href="lekcje.html"
                class="active"
            >
                Lekcje
            </a>

            <a href="e8.html">
                Inne
            </a>

        </div>

    </div>

</nav>


<!-- =====================================================
     TREŚĆ
===================================================== -->

<main>

<section class="lessons-page">


    <!-- NAGŁÓWEK -->

    <div class="lessons-header">

        <h1>
            Lista <strong>lekcji.</strong>
        </h1>

        <p>
            Tutaj znajdziesz zapis tego, co danego dnia
            było robione w szkole, wraz z dodatkowymi
            materiałami i zdjęciami.
        </p>

    </div>

    <!-- SORTOWANIE -->

<div class="sort-container">
<button
    type="button"
    class="sort-button"
    id="sortButton"
>
    <span>
        Sortuj wg. <strong id="sortCurrent">Najnowsze</strong>
    </span>

    <span class="sort-arrow">
        ▼
    </span>
</button>


<div
    class="sort-menu"
    id="sortMenu"
>

    <button
        type="button"
        data-sort="newest"
    >
        Najnowsze
    </button>

    <button
        type="button"
        data-sort="oldest"
    >
        Najstarsze
    </button>

    <div
        class="sort-divider"
    ></div>

    <div
        class="sort-months"
        id="sortMonths"
    ></div>

</div>

</div>


    <!-- LISTA DNI -->

    <div id="daysView">

        <div id="daysList">

            <div class="loading">
                Ładowanie lekcji...
            </div>

        </div>

    </div>


    <!-- SZCZEGÓŁY DNIA -->

    <div id="dayDetails">

        <button
            class="back-button"
            onclick="showDays()"
            type="button"
        >
            ← Powrót
        </button>


        <div class="details-header">

            <div
                class="date-label"
                id="detailDate"
            ></div>

            <div
                class="weekday-label"
                id="detailWeekday"
            ></div>

            <h2>
                Lekcje
            </h2>

        </div>


        <div class="lessons-box">

            <div id="lessonList"></div>


            <!-- MATERIAŁY DNIA -->

            <div
                class="materials"
                id="materials"
            >

                <div class="materials-title">
                    Materiały
                </div>


                <div
                    id="photoGallery"
                    class="photo-gallery"
                ></div>


                <div
                    id="materialsList"
                    class="materials-list"
                ></div>

            </div>

        </div>

    </div>

</section>

</main>


<!-- =====================================================
     PODGLĄD ZDJĘCIA
===================================================== -->

<div
    id="imageViewer"
    aria-hidden="true"
>

    <!-- LICZNIK -->

    <div
        class="image-counter"
        id="imageCounter"
    >
        1/1
    </div>


    <!-- ZAMKNIJ -->

    <button
        class="image-close"
        onclick="closeImage()"
        aria-label="Zamknij"
        type="button"
    >
        ×
    </button>


    <!-- LEWA STRZAŁKA -->

    <button
        class="image-nav image-prev"
        id="imagePrev"
        onclick="previousImage(event)"
        aria-label="Poprzednie zdjęcie"
        type="button"
    >
        <
    </button>


    <!-- ZDJĘCIE -->

    <img
        id="viewerImage"
        src=""
        alt="Podgląd zdjęcia"
    >


    <!-- PRAWA STRZAŁKA -->

    <button
        class="image-nav image-next"
        id="imageNext"
        onclick="nextImage(event)"
        aria-label="Następne zdjęcie"
        type="button"
    >
        >
    </button>

</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="footer-container">

        <strong>
            LEKCJE
        </strong>

        <span>
            © 2026 — Archiwum lekcji
        </span>

    </div>

</footer>


<script>

const API = "https://old-term-d35c.oliwierbielicki.workers.dev";

let allDays = [];


/* =====================================================
   PODGLĄD ZDJĘĆ
===================================================== */

let viewerImages = [];
let currentImageIndex = 0;


/* =====================================================
   DNI TYGODNIA
===================================================== */

const WEEK_DAYS = {

    0: "niedziela",
    1: "poniedziałek",
    2: "wtorek",
    3: "środa",
    4: "czwartek",
    5: "piątek",
    6: "sobota"

};


/* =====================================================
   MIESIĄCE
===================================================== */

const MONTHS = [

    "",
    "STYCZEŃ",
    "LUTY",
    "MARZEC",
    "KWIECIEŃ",
    "MAJ",
    "CZERWIEC",
    "LIPIEC",
    "SIERPIEŃ",
    "WRZESIEŃ",
    "PAŹDZIERNIK",
    "LISTOPAD",
    "GRUDZIEŃ"

];


loadLessons();


/* =====================================================
   POBIERANIE LEKCJI
===================================================== */

async function loadLessons() {

    const container = document.getElementById("daysList");

    try {

        const response = await fetch(`${API}/lessons`);

        if (!response.ok) {
            throw new Error("Nie udało się pobrać lekcji.");
        }

        allDays = await response.json();

        allDays.sort(
            (a, b) => b.date.localeCompare(a.date)
        );

        renderDays();

    } catch (error) {

        container.innerHTML = `
            <div class="empty">
                Nie udało się pobrać listy lekcji.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


/* =====================================================
   RENDER LISTY DNI
===================================================== */

function renderDays() {

    const container = document.getElementById("daysList");

    container.innerHTML = "";

    if (!allDays.length) {

        container.innerHTML = `
            <div class="empty">
                Nie ma jeszcze zapisanych lekcji.
            </div>
        `;

        return;
    }


    const today = new Date().toLocaleDateString(
        "sv-SE",
        {
            timeZone: "Europe/Warsaw"
        }
    );


    let previousMonth = null;


    allDays.forEach((day, index) => {

        const [, month] = day.date.split("-");
        const monthNumber = Number(month);


        if (monthNumber !== previousMonth) {

            const separator =
                document.createElement("div");

            separator.className =
                "month-separator";

            separator.textContent =
                MONTHS[monthNumber] || "";

            container.appendChild(separator);

            previousMonth = monthNumber;

        }


        const card =
            document.createElement("div");

        card.className =
            "day-card";


        const isNew =
            day.date === today;


        const weekday =
            getWeekdayName(day.date);


        const lessonCount =
            Array.isArray(day.lessons)
                ? day.lessons.length
                : 0;


        card.innerHTML = `

            ${
                isNew
                    ? `<div class="day-new">NOWOŚĆ!</div>`
                    : ""
            }

            <div class="day-left">

                <div class="day-icon">
                    📚
                </div>

                <div class="day-info">

                    <h2>
                        ${escapeHtml(
                            formatDate(day.date)
                        )}
                    </h2>

                    <p>
                        ${escapeHtml(weekday)}
                        -
                        ${lessonCount}
                        ${lessonWord(lessonCount)}
                    </p>

                </div>

            </div>

            <div class="day-arrow">
                →
            </div>

        `;


        card.style.animationDelay =
            `${index * 0.05}s`;


        card.addEventListener(
            "click",
            () => showDay(day)
        );


        container.appendChild(card);

    });

}


/* =====================================================
   POKAŻ SZCZEGÓŁY DNIA
===================================================== */

function showDay(day) {

    document.getElementById(
        "daysView"
    ).style.display = "none";


    document.getElementById(
        "dayDetails"
    ).classList.add("active");


    document.getElementById(
        "detailDate"
    ).textContent =
        formatDate(day.date);


    document.getElementById(
        "detailWeekday"
    ).textContent =
        getWeekdayName(day.date);


    renderLessons(day.lessons);

    renderMaterials(day.files);


    window.scrollTo({

        top: 0,
        behavior: "smooth"

    });

}


/* =====================================================
   WRÓĆ DO LISTY
===================================================== */

function showDays() {

    document.getElementById(
        "dayDetails"
    ).classList.remove("active");


    document.getElementById(
        "daysView"
    ).style.display = "block";


    window.scrollTo({

        top: 0,
        behavior: "smooth"

    });

}


/* =====================================================
   RENDER LEKCJI
===================================================== */

function renderLessons(lessons) {

    const container =
        document.getElementById("lessonList");


    container.innerHTML = "";


    if (
        !Array.isArray(lessons) ||
        !lessons.length
    ) {

        container.innerHTML = `
            <div class="empty">
                Brak informacji o lekcjach.
            </div>
        `;

        return;
    }


    lessons.forEach((lesson, index) => {

        const element =
            document.createElement("div");

        element.className =
            "lesson";


        const attachments =
            Array.isArray(lesson.attachments)
                ? lesson.attachments
                : [];


        element.innerHTML = `

            <div class="lesson-number">
                LEKCJA ${index + 1}
            </div>

            <h3>
                ${escapeHtml(
                    lesson.subject || "Bez nazwy"
                )}
            </h3>

            <p>
                ${escapeHtml(
                    lesson.content ||
                    "Brak informacji."
                )}
            </p>

            ${
                attachments.length
                    ? `

                    <div class="lesson-attachments">

                        <button
                            type="button"
                            class="lesson-attachments-button"
                        >
                            📎 Załączniki
                            (${attachments.length})
                        </button>


                        <div
                            class="lesson-attachments-content"
                        >

                            <div
                                class="photo-gallery"
                            ></div>

                            <div
                                class="lesson-attachment-links"
                            ></div>

                        </div>

                    </div>

                    `
                    : ""
            }

        `;


        if (attachments.length) {

            const button =
                element.querySelector(
                    ".lesson-attachments-button"
                );


            const content =
                element.querySelector(
                    ".lesson-attachments-content"
                );


            const gallery =
                element.querySelector(
                    ".photo-gallery"
                );


            const links =
                element.querySelector(
                    ".lesson-attachment-links"
                );


            /*
             * Zdjęcia tylko z tej konkretnej lekcji.
             */

            const lessonImages = [];


            attachments.forEach(file => {

                if (!file || !file.url) {
                    return;
                }


                const url =
                    String(file.url).trim();


                const name =
                    file.name || "Załącznik";


                if (isImage(url)) {

                    lessonImages.push({

                        url: url,
                        name: name

                    });


                    const card =
                        document.createElement("div");


                    card.className =
                        "photo-card";


                    const image =
                        document.createElement("img");


                    image.src = url;

                    image.alt = name;

                    image.loading = "lazy";


                    image.onerror = () => {

                        card.remove();

                    };


                    card.appendChild(image);


                    card.addEventListener(
                        "click",
                        () => {

                            openImage(
                                lessonImages,
                                lessonImages.findIndex(
                                    item =>
                                        item.url === url
                                )
                            );

                        }
                    );


                    gallery.appendChild(card);

                } else {

                    const link =
                        document.createElement("a");


                    link.className =
                        "material";


                    link.href = url;

                    link.target = "_blank";

                    link.rel =
                        "noopener noreferrer";


                    link.textContent =
                        `🔗 ${name}`;


                    links.appendChild(link);

                }

            });


            if (!lessonImages.length) {

                gallery.style.display = "none";

            }


            if (!links.children.length) {

                links.style.display = "none";

            }


            button.addEventListener(
                "click",
                () => {

                    content.classList.toggle(
                        "active"
                    );


                    if (
                        content.classList.contains(
                            "active"
                        )
                    ) {

                        button.textContent =
                            "📎 Ukryj załączniki";

                    } else {

                        button.textContent =
                            `📎 Załączniki (${attachments.length})`;

                    }

                }
            );

        }


        container.appendChild(element);

    });

}


/* =====================================================
   MATERIAŁY DNIA
===================================================== */

function renderMaterials(files) {

    const section =
        document.getElementById("materials");


    const gallery =
        document.getElementById("photoGallery");


    const links =
        document.getElementById("materialsList");


    gallery.innerHTML = "";

    links.innerHTML = "";


    if (
        !Array.isArray(files) ||
        !files.length
    ) {

        section.style.display = "none";

        return;
    }


    section.style.display = "block";


    const dayImages = [];


    files.forEach(file => {

        if (!file || !file.url) {
            return;
        }


        const url =
            String(file.url).trim();


        const name =
            file.name || "Materiał";


        if (isImage(url)) {

            dayImages.push({

                url: url,
                name: name

            });


            const card =
                document.createElement("div");


            card.className =
                "photo-card";


            const image =
                document.createElement("img");


            image.src = url;

            image.alt = name;

            image.loading = "lazy";


            image.onerror = () => {

                card.remove();

            };


            card.appendChild(image);


            card.addEventListener(
                "click",
                () => {

                    openImage(
                        dayImages,
                        dayImages.findIndex(
                            item =>
                                item.url === url
                        )
                    );

                }
            );


            gallery.appendChild(card);

        } else {

            const link =
                document.createElement("a");


            link.className =
                "material";


            link.href = url;

            link.target = "_blank";

            link.rel =
                "noopener noreferrer";


            link.textContent =
                `🔗 ${name}`;


            links.appendChild(link);

        }

    });


    gallery.style.display =
        dayImages.length
            ? "grid"
            : "none";


    links.style.display =
        links.children.length
            ? "flex"
            : "none";


    if (
        !gallery.children.length &&
        !links.children.length
    ) {

        section.style.display = "none";

    }

}


/* =====================================================
   CZY LINK JEST ZDJĘCIEM
===================================================== */

function isImage(url) {

    const clean =
        url
            .split("?")[0]
            .split("#")[0]
            .toLowerCase();


    return (

        clean.endsWith(".jpg") ||
        clean.endsWith(".jpeg") ||
        clean.endsWith(".png") ||
        clean.endsWith(".webp") ||
        clean.endsWith(".gif") ||
        clean.endsWith(".avif")

    );

}


/* =====================================================
   OTWÓRZ ZDJĘCIE
===================================================== */

function openImage(images, index = 0) {

    if (
        !Array.isArray(images) ||
        !images.length
    ) {
        return;
    }


    viewerImages = images;

    currentImageIndex =
        Math.max(
            0,
            Math.min(
                index,
                viewerImages.length - 1
            )
        );


    const viewer =
        document.getElementById(
            "imageViewer"
        );


    viewer.classList.add("active");

    viewer.setAttribute(
        "aria-hidden",
        "false"
    );


    document.body.style.overflow =
        "hidden";


    updateViewer();

}


/* =====================================================
   AKTUALIZUJ PODGLĄD
===================================================== */

function updateViewer() {

    if (!viewerImages.length) {
        return;
    }


    const current =
        viewerImages[
            currentImageIndex
        ];


    const image =
        document.getElementById(
            "viewerImage"
        );


    const counter =
        document.getElementById(
            "imageCounter"
        );


    const previous =
        document.getElementById(
            "imagePrev"
        );


    const next =
        document.getElementById(
            "imageNext"
        );


    image.src = current.url;

    image.alt =
        current.name || "Zdjęcie";


    counter.textContent =
        `${currentImageIndex + 1}/${viewerImages.length}`;


    /*
     * Strzałki pokazujemy tylko wtedy,
     * gdy jest więcej niż jedno zdjęcie.
     */

    const hasMultiple =
        viewerImages.length > 1;


    previous.style.display =
        hasMultiple
            ? "flex"
            : "none";


    next.style.display =
        hasMultiple
            ? "flex"
            : "none";

}


/* =====================================================
   POPRZEDNIE ZDJĘCIE
===================================================== */

function previousImage(event) {

    if (event) {
        event.stopPropagation();
    }


    if (viewerImages.length <= 1) {
        return;
    }


    currentImageIndex--;

    if (currentImageIndex < 0) {

        currentImageIndex =
            viewerImages.length - 1;

    }


    updateViewer();

}


/* =====================================================
   NASTĘPNE ZDJĘCIE
===================================================== */

function nextImage(event) {

    if (event) {
        event.stopPropagation();
    }


    if (viewerImages.length <= 1) {
        return;
    }


    currentImageIndex++;


    if (
        currentImageIndex >=
        viewerImages.length
    ) {

        currentImageIndex = 0;

    }


    updateViewer();

}


/* =====================================================
   ZAMKNIJ PODGLĄD
===================================================== */

function closeImage(event) {

    if (
        event &&
        event.target &&
        event.target.id === "viewerImage"
    ) {
        return;
    }


    const viewer =
        document.getElementById(
            "imageViewer"
        );


    viewer.classList.remove("active");


    viewer.setAttribute(
        "aria-hidden",
        "true"
    );


    document.body.style.overflow =
        "";


    viewerImages = [];

    currentImageIndex = 0;

}


/* =====================================================
   KLIKNIĘCIE W TŁO
===================================================== */

document
    .getElementById("imageViewer")
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "imageViewer"
            ) {

                closeImage();

            }

        }
    );


/* =====================================================
   KLAWIATURA
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        const viewer =
            document.getElementById(
                "imageViewer"
            );


        if (
            !viewer.classList.contains(
                "active"
            )
        ) {
            return;
        }


        if (event.key === "Escape") {

            closeImage();

            return;

        }


        if (event.key === "ArrowLeft") {

            previousImage();

            return;

        }


        if (event.key === "ArrowRight") {

            nextImage();

            return;

        }

    }
);


/* =====================================================
   SŁOWO "LEKCJA"
===================================================== */

function lessonWord(count) {

    if (count === 1) {
        return "lekcja";
    }


    if (
        count >= 2 &&
        count <= 4
    ) {
        return "lekcje";
    }


    return "lekcji";

}


/* =====================================================
   DATA
===================================================== */

function formatDate(date) {

    const [
        year,
        month,
        day
    ] = date.split("-");


    const months = [

        "",
        "stycznia",
        "lutego",
        "marca",
        "kwietnia",
        "maja",
        "czerwca",
        "lipca",
        "sierpnia",
        "września",
        "października",
        "listopada",
        "grudnia"

    ];


    return `${Number(day)} ${months[Number(month)]} ${year}`;

}


/* =====================================================
   DZIEŃ TYGODNIA
===================================================== */

function getWeekdayName(date) {

    const dateObject =
        new Date(`${date}T12:00:00`);


    return WEEK_DAYS[
        dateObject.getDay()
    ];

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

    return String(text ?? "")

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   HAMBURGER MENU
===================================================== */

const hamburger =
    document.getElementById(
        "hamburger"
    );


const menu =
    document.getElementById(
        "menu"
    );


if (hamburger && menu) {


    hamburger.addEventListener(
        "click",
        () => {

            hamburger.classList.toggle(
                "active"
            );


            menu.classList.toggle(
                "active"
            );


            const menuIsOpen =
                menu.classList.contains(
                    "active"
                );


            hamburger.setAttribute(
                "aria-expanded",
                menuIsOpen
                    ? "true"
                    : "false"
            );

        }
    );


    hamburger.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                hamburger.click();

            }

        }
    );


    menu
        .querySelectorAll("a")
        .forEach(link => {

            link.addEventListener(
                "click",
                () => {

                    hamburger.classList.remove(
                        "active"
                    );


                    menu.classList.remove(
                        "active"
                    );


                    hamburger.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }
            );

        });


    window.addEventListener(
        "resize",
        () => {

            if (window.innerWidth > 700) {

                hamburger.classList.remove(
                    "active"
                );


                menu.classList.remove(
                    "active"
                );


                hamburger.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }

        }
    );

}

</script>
