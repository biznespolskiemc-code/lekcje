<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lekcje</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(40, 120, 255, .12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(0, 180, 255, .08), transparent 35%),
                #070b12;
            color: white;
            min-height: 100vh;
        }

        nav {
            height: 76px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 30px;
            background: rgba(7, 11, 18, .78);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        nav .logo {
            font-size: 19px;
            font-weight: 800;
        }

        .lessons-page {
            max-width: 1100px;
            margin: auto;
            padding: 105px 20px 80px;
        }

        .hero-label {
            color: #4ea1ff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 800;
        }

        .subtitle {
            color: #8c98aa;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 13px;
        }

        .day {
            padding: 20px;
            border-radius: 17px;
            background: rgba(15, 22, 34, .72);
            border: 1px solid rgba(255,255,255,.07);
            cursor: pointer;
            transition: .2s;
        }

        .day:hover {
            transform: translateY(-2px);
            border-color: rgba(78,161,255,.35);
            background: rgba(20, 30, 47, .8);
        }

        .day-date {
            font-size: 18px;
            font-weight: 800;
        }

        .day-info {
            margin-top: 8px;
            color: #8290a4;
            font-size: 13px;
        }

        .details {
            display: none;
        }

        .back {
            display: inline-flex;
            margin-bottom: 20px;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);
            color: #dce5f2;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
        }

        .detail-date {
            color: #4ea1ff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .detail-title {
            margin-top: 8px;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 800;
        }

        .lesson-card {
            background: rgba(15, 22, 34, .72);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 17px;
            padding: 20px;
            margin-bottom: 13px;
        }

        .lesson-top {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .lesson-number {
            min-width: 42px;
            height: 42px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(62,143,255,.12);
            color: #58a4ff;
            font-weight: 800;
            font-size: 14px;
        }

        .lesson-subject {
            font-size: 17px;
            font-weight: 800;
        }

        .lesson-content {
            color: #a5afbf;
            font-size: 14px;
            line-height: 1.7;
            margin-top: 14px;
            white-space: pre-wrap;
        }

        .attachment-button {
            margin-top: 15px;
            padding: 10px 13px;
            background: rgba(78,161,255,.1);
            color: #65aaff;
            border: 1px solid rgba(78,161,255,.16);
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
        }

        .attachment-button:hover {
            background: rgba(78,161,255,.16);
        }

        .attachments {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .attachments.show {
            display: block;
        }

        .attachment-title {
            font-size: 12px;
            font-weight: 800;
            color: #8c98aa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .attachment-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .attachment-item {
            width: 180px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.07);
        }

        .attachment-item img {
            width: 100%;
            height: 130px;
            display: block;
            object-fit: cover;
            cursor: pointer;
        }

        .attachment-name {
            display: block;
            padding: 9px;
            color: #c6cfdd;
            font-size: 11px;
            font-weight: 600;
        }

        .file-link {
            display: block;
            padding: 12px;
            color: #65aaff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #748096;
            background: rgba(255,255,255,.025);
            border-radius: 15px;
        }

        .image-modal {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: rgba(0,0,0,.88);
        }

        .image-modal.show {
            display: flex;
        }

        .image-modal img {
            max-width: 95vw;
            max-height: 90vh;
            border-radius: 12px;
            object-fit: contain;
        }

        .close-modal {
            position: fixed;
            top: 20px;
            right: 25px;
            border: 0;
            background: rgba(255,255,255,.1);
            color: white;
            font-size: 25px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
        }

        @media (max-width: 700px) {

            nav {
                height: 68px;
                padding: 0 17px;
            }

            .lessons-page {
                padding: 90px 15px 60px;
            }

            h1 {
                font-size: 29px;
            }

            .days {
                grid-template-columns: 1fr;
            }

            .attachment-item {
                width: 100%;
            }

            .attachment-item img {
                height: 190px;
            }

        }

    </style>
</head>

<body>

<nav>
    <div class="logo">LEKCJE</div>
</nav>


<main class="lessons-page">

    <div id="daysView">

        <div class="hero-label">LEKCJE</div>

        <h1>Historia lekcji</h1>

        <p class="subtitle">
            Wybierz dzień, aby zobaczyć zapisane lekcje.
        </p>

        <div id="days" class="days"></div>

    </div>


    <div id="detailsView" class="details">

        <button class="back" onclick="showDays()">
            ← Wróć do dni
        </button>

        <div id="detailDate" class="detail-date"></div>

        <div id="detailTitle" class="detail-title"></div>

        <div id="lessons"></div>

    </div>

</main>


<div
    id="imageModal"
    class="image-modal"
    onclick="closeImage()"
>

    <button
        class="close-modal"
        onclick="event.stopPropagation(); closeImage()"
    >
        ×
    </button>

    <img
        id="modalImage"
        src=""
        alt=""
        onclick="event.stopPropagation()"
    >

</div>


<script>

const API =
    "https://old-term-d35c.oliwierbielicki.workers.dev";

let allDays = [];


/* =========================
   START
========================= */

loadLessons();


async function loadLessons() {

    const container =
        document.getElementById("days");


    try {

        const response =
            await fetch(`${API}/lessons`);


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Nie udało się pobrać lekcji."
            );

        }


        allDays = Array.isArray(data)
            ? data
            : [];


        renderDays();


    } catch (error) {

        container.innerHTML =
            `<div class="empty">
                Nie udało się załadować lekcji.<br><br>
                ${escapeHtml(error.message)}
            </div>`;

    }

}


/* =========================
   LISTA DNI
========================= */

function renderDays() {

    const container =
        document.getElementById("days");


    if (!allDays.length) {

        container.innerHTML =
            `<div class="empty">
                Nie ma jeszcze żadnych zapisanych lekcji.
            </div>`;

        return;
    }


    container.innerHTML = "";


    [...allDays]
        .sort((a, b) =>
            a.date.localeCompare(b.date)
        )
        .forEach(day => {

            const count =
                Array.isArray(day.lessons)
                    ? day.lessons.length
                    : 0;


            const card =
                document.createElement("div");


            card.className = "day";


            card.onclick = () =>
                showDay(day.date);


            card.innerHTML = `

                <div class="day-date">
                    ${escapeHtml(formatDate(day.date))}
                </div>

                <div class="day-info">
                    ${escapeHtml(getWeekdayName(day.date))}
                    - ${count} ${lessonWord(count)}
                </div>

            `;


            container.appendChild(card);

        });

}


/* =========================
   KONKRETNY DZIEŃ
========================= */

function showDay(date) {

    const day =
        allDays.find(item =>
            item.date === date
        );


    if (!day) return;


    document.getElementById("daysView")
        .style.display = "none";


    document.getElementById("detailsView")
        .style.display = "block";


    document.getElementById("detailDate")
        .textContent =
            formatDate(day.date);


    const count =
        Array.isArray(day.lessons)
            ? day.lessons.length
            : 0;


    document.getElementById("detailTitle")
        .textContent =
            `${capitalize(getWeekdayName(day.date))} - ${count} ${lessonWord(count)}`;


    renderLessons(day.lessons || []);

}


function showDays() {

    document.getElementById("detailsView")
        .style.display = "none";


    document.getElementById("daysView")
        .style.display = "block";

}


/* =========================
   LEKCJE
========================= */

function renderLessons(lessons) {

    const container =
        document.getElementById("lessons");


    container.innerHTML = "";


    if (!lessons.length) {

        container.innerHTML =
            `<div class="empty">
                Brak lekcji tego dnia.
            </div>`;

        return;
    }


    lessons.forEach((lesson, index) => {

        const card =
            document.createElement("div");


        card.className = "lesson-card";


        const attachments =
            Array.isArray(lesson.attachments)
                ? lesson.attachments
                : [];


        card.innerHTML = `

            <div class="lesson-top">

                <div class="lesson-number">
                    ${index + 1}
                </div>

                <div class="lesson-subject">
                    ${escapeHtml(
                        lesson.subject || "Bez przedmiotu"
                    )}
                </div>

            </div>

            ${
                lesson.content
                    ? `
                        <div class="lesson-content">
                            ${escapeHtml(lesson.content)}
                        </div>
                    `
                    : ""
            }

            ${
                attachments.length
                    ? `
                        <button
                            class="attachment-button"
                            onclick="toggleAttachments(this)"
                        >
                            📎 Załączniki (${attachments.length})
                        </button>

                        <div class="attachments">

                            <div class="attachment-title">
                                Załączniki do tej lekcji
                            </div>

                            <div class="attachment-list">

                                ${renderAttachments(attachments)}

                            </div>

                        </div>
                    `
                    : ""
            }

        `;


        container.appendChild(card);

    });

}


/* =========================
   ZAŁĄCZNIKI
========================= */

function renderAttachments(attachments) {

    return attachments.map(file => {

        const name =
            file.name || "Załącznik";

        const url =
            file.url || "";


        if (!url) return "";


        if (isImage(url)) {

            return `

                <div class="attachment-item">

                    <img
                        src="${escapeAttribute(url)}"
                        alt="${escapeAttribute(name)}"
                        loading="lazy"
                        onclick="openImage('${escapeAttribute(url)}')"
                        onerror="this.parentElement.style.display='none'"
                    >

                    <span class="attachment-name">
                        ${escapeHtml(name)}
                    </span>

                </div>

            `;

        }


        return `

            <div class="attachment-item">

                <a
                    class="file-link"
                    href="${escapeAttribute(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    📄 ${escapeHtml(name)}
                </a>

            </div>

        `;

    }).join("");

}


function toggleAttachments(button) {

    const attachments =
        button.nextElementSibling;


    attachments.classList.toggle("show");


    if (attachments.classList.contains("show")) {

        button.textContent =
            "📎 Ukryj załączniki";

    } else {

        const count =
            attachments.querySelectorAll(
                ".attachment-item"
            ).length;


        button.textContent =
            `📎 Załączniki (${count})`;

    }

}


function isImage(url) {

    const cleanUrl =
        url.split("?")[0].toLowerCase();


    return (
        cleanUrl.endsWith(".jpg") ||
        cleanUrl.endsWith(".jpeg") ||
        cleanUrl.endsWith(".png") ||
        cleanUrl.endsWith(".webp") ||
        cleanUrl.endsWith(".gif") ||
        cleanUrl.endsWith(".avif")
    );

}


/* =========================
   POWIĘKSZANIE ZDJĘCIA
========================= */

function openImage(url) {

    document.getElementById("modalImage")
        .src = url;


    document.getElementById("imageModal")
        .classList.add("show");

}


function closeImage() {

    document.getElementById("imageModal")
        .classList.remove("show");


    document.getElementById("modalImage")
        .src = "";

}


/* =========================
   DATY
========================= */

function formatDate(dateString) {

    const [year, month, day] =
        dateString.split("-");


    const date =
        new Date(
            Number(year),
            Number(month) - 1,
            Number(day)
        );


    return date.toLocaleDateString(
        "pl-PL",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


function getWeekdayName(dateString) {

    const [year, month, day] =
        dateString.split("-");


    const date =
        new Date(
            Number(year),
            Number(month) - 1,
            Number(day)
        );


    const names = [
        "niedziela",
        "poniedziałek",
        "wtorek",
        "środa",
        "czwartek",
        "piątek",
        "sobota"
    ];


    return names[date.getDay()];

}


function lessonWord(count) {

    if (count === 1) return "lekcja";

    if (
        count >= 2 &&
        count <= 4
    ) {
        return "lekcje";
    }

    return "lekcji";

}


function capitalize(text) {

    if (!text) return "";

    return text.charAt(0).toUpperCase() +
        text.slice(1);

}


/* =========================
   BEZPIECZNE HTML
========================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHtml(value);

}

</script>

</body>
</html>
