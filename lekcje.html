<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LEKCJE | Lista lekcji</title>

    <link
        rel="icon"
        type="image/png"
        href="Polak.png"
    >

    <link
        rel="stylesheet"
        href="style-index.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        .lessons-page {

            width: 100%;

            max-width: 1000px;

            margin: auto;

            padding:
                150px
                20px
                80px;

        }


        .lessons-header {

            text-align: center;

            margin-bottom: 55px;

        }


        .lessons-header h1 {

            margin:
                0 0 15px;

            font-size:
                clamp(40px, 6vw, 68px);

            font-weight: 800;

            letter-spacing:
                -2px;

        }


        .lessons-header h1 span {

            color:
                var(--blue-light);

        }


        .lessons-header p {

            margin: 0;

            color:
                rgba(255,255,255,.45);

            line-height:
                1.7;

        }


        /* ==============================
           LISTA DNI
        ============================== */

        #daysList {

            display:
                flex;

            flex-direction:
                column;

            gap:
                12px;

        }


        .day-card {

            position:
                relative;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

            padding:
                22px 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.018)
                );

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius:
                15px;

            cursor:
                pointer;

            opacity:
                0;

            animation:
                dayAppear .5s ease forwards;

            transition:
                transform .3s ease,
                background .3s ease,
                border-color .3s ease;

        }


        .day-card:hover {

            transform:
                translateX(5px);

            background:
                rgba(24,176,214,.055);

            border-color:
                rgba(24,176,214,.4);

        }


        .day-left {

            display:
                flex;

            align-items:
                center;

            gap:
                18px;

        }


        .day-icon {

            width:
                48px;

            height:
                48px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            flex-shrink:
                0;

            color:
                var(--blue-light);

            background:
                rgba(24,176,214,.08);

            border:
                1px solid
                rgba(24,176,214,.15);

            border-radius:
                12px;

            font-size:
                20px;

        }


        .day-info h2 {

            margin:
                0 0 5px;

            font-size:
                18px;

        }


        .day-info p {

            margin: 0;

            color:
                rgba(255,255,255,.4);

            font-size:
                13px;

        }


        .day-arrow {

            color:
                rgba(255,255,255,.3);

            font-size:
                22px;

            transition:
                transform .3s ease,
                color .3s ease;

        }


        .day-card:hover .day-arrow {

            color:
                var(--blue-light);

            transform:
                translateX(5px);

        }


        /* ==============================
           SZCZEGÓŁY
        ============================== */

        #dayDetails {

            display:
                none;

            animation:
                detailsAppear .45s ease both;

        }


        #dayDetails.active {

            display:
                block;

        }


        .back-button {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                9px;

            margin-bottom:
                30px;

            padding:
                10px 16px;

            color:
                rgba(255,255,255,.55);

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius:
                9px;

            cursor:
                pointer;

            transition:
                color .25s ease,
                transform .25s ease,
                border-color .25s ease;

        }


        .back-button:hover {

            color: white;

            transform:
                translateX(-4px);

            border-color:
                rgba(24,176,214,.4);

        }


        .details-header {

            margin-bottom:
                30px;

            text-align:
                center;

        }


        .details-header .date-label {

            margin-bottom:
                9px;

            color:
                var(--blue-light);

            font-size:
                11px;

            font-weight:
                700;

            letter-spacing:
                2px;

        }


        .details-header h2 {

            margin: 0;

            font-size:
                clamp(34px,5vw,52px);

            font-weight:
                800;

        }


        .lessons-box {

            padding:
                30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.018)
                );

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius:
                18px;

        }


        .lesson {

            padding:
                25px 0;

            border-bottom:
                1px solid
                rgba(255,255,255,.08);

        }


        .lesson:first-child {

            padding-top: 0;

        }


        .lesson:last-child {

            padding-bottom: 0;

            border-bottom:
                none;

        }


        .lesson-number {

            margin-bottom:
                9px;

            color:
                var(--blue-light);

            font-size:
                10px;

            font-weight:
                700;

            letter-spacing:
                2px;

        }


        .lesson h3 {

            margin:
                0 0 10px;

            font-size:
                22px;

        }


        .lesson p {

            margin: 0;

            color:
                rgba(255,255,255,.6);

            line-height:
                1.8;

            white-space:
                pre-wrap;

        }


        /* ==============================
           MATERIAŁY
        ============================== */

        .materials {

            margin-top:
                30px;

            padding-top:
                25px;

            border-top:
                1px solid
                rgba(255,255,255,.08);

        }


        .materials-title {

            margin-bottom:
                15px;

            font-size:
                18px;

            font-weight:
                700;

        }


        .materials-list {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                10px;

        }


        .material {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

            padding:
                10px 14px;

            color:
                white;

            text-decoration:
                none;

            background:
                rgba(24,176,214,.06);

            border:
                1px solid
                rgba(24,176,214,.18);

            border-radius:
                9px;

            font-size:
                13px;

            transition:
                background .25s ease,
                border-color .25s ease;

        }


        .material:hover {

            background:
                rgba(24,176,214,.13);

            border-color:
                rgba(24,176,214,.45);

        }


        .empty {

            padding:
                45px 20px;

            text-align:
                center;

            color:
                rgba(255,255,255,.35);

        }


        .loading {

            padding:
                40px;

            text-align:
                center;

            color:
                rgba(255,255,255,.4);

        }


        /* ==============================
           ANIMACJE
        ============================== */

        @keyframes dayAppear {

            from {

                opacity: 0;

                transform:
                    translateY(15px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes detailsAppear {

            from {

                opacity: 0;

                transform:
                    translateY(15px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @media (max-width:600px) {

            .lessons-page {

                padding:
                    120px
                    15px
                    60px;

            }


            .day-card {

                padding:
                    18px;

            }


            .day-icon {

                width:
                    42px;

                height:
                    42px;

            }


            .lessons-box {

                padding:
                    22px;

            }

        }

    </style>

</head>


<body>


<div class="background">

    <div class="background-glow glow-one"></div>

    <div class="background-glow glow-two"></div>

    <div class="grid"></div>

</div>


<nav class="navbar">

    <div class="nav-container">

        <a
            href="index.html"
            class="logo"
        >
            LEKCJE
        </a>

        <div class="menu">

            <a href="index.html">
                Strona główna
            </a>

            <a
                href="lekcje.html"
                class="active"
            >
                Lekcje
            </a>

            <a href="plan.html">
                Plan lekcji
            </a>

        </div>

    </div>

</nav>


<main>

<section class="lessons-page">


    <!-- ==============================
         NAGŁÓWEK
    ============================== -->

    <div class="lessons-header">

        <div class="hero-label">

            <span></span>

            ARCHIWUM LEKCJI

        </div>

        <h1>
            Lista <span>lekcji.</span>
        </h1>

        <p>
            Wybierz dzień, aby zobaczyć
            wszystkie lekcje.
        </p>

    </div>


    <!-- ==============================
         LISTA DNI
    ============================== -->

    <div id="daysView">

        <div
            id="daysList"
        >

            <div class="loading">
                Ładowanie lekcji...
            </div>

        </div>

    </div>


    <!-- ==============================
         SZCZEGÓŁY DNIA
    ============================== -->

    <div id="dayDetails">

        <button
            class="back-button"
            onclick="showDays()"
        >
            ← Wszystkie dni
        </button>


        <div class="details-header">

            <div
                class="date-label"
                id="detailDate"
            >
            </div>

            <h2>
                Lekcje
            </h2>

        </div>


        <div class="lessons-box">

            <div
                id="lessonList"
            >
            </div>


            <div
                class="materials"
                id="materials"
            >

                <div class="materials-title">
                    Materiały
                </div>

                <div
                    class="materials-list"
                    id="materialsList"
                >
                </div>

            </div>

        </div>

    </div>


</section>

</main>


<footer>

    <div class="footer-container">

        <strong>
            LEKCJE
        </strong>

        <span>
            © 2026 — Archiwum lekcji
        </span>

    </div>

</footer>


<script>


// ======================================
// API
// ======================================

const API =
    "https://old-term-d35c.oliwierbielicki.workers.dev";


// ======================================
// DANE
// ======================================

let allDays = [];


// ======================================
// START
// ======================================

loadLessons();


// ======================================
// POBIERANIE DANYCH
// ======================================

async function loadLessons() {

    const container =
        document.getElementById(
            "daysList"
        );


    try {

        const response =
            await fetch(
                `${API}/lessons`
            );


        if (!response.ok) {

            throw new Error(
                "Nie udało się pobrać lekcji."
            );

        }


        allDays =
            await response.json();


        renderDays();


    } catch (error) {

        container.innerHTML = `

            <div class="empty">

                Nie udało się pobrać
                listy lekcji.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


// ======================================
// LISTA DNI
// ======================================

function renderDays() {

    const container =
        document.getElementById(
            "daysList"
        );


    container.innerHTML = "";


    if (
        !allDays.length
    ) {

        container.innerHTML = `

            <div class="empty">

                Nie ma jeszcze
                zapisanych lekcji.

            </div>

        `;

        return;

    }


    allDays.forEach(
        (day, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "day-card";


            card.style.animationDelay =
                `${index * 0.05}s`;


            const lessonCount =
                Array.isArray(day.lessons)
                    ? day.lessons.length
                    : 0;


            card.innerHTML = `

                <div class="day-left">

                    <div class="day-icon">
                        📚
                    </div>

                    <div class="day-info">

                        <h2>
                            ${formatDate(
                                day.date
                            )}
                        </h2>

                        <p>
                            ${lessonCount}
                            ${
                                lessonCount === 1
                                    ? "lekcja"
                                    : "lekcji"
                            }
                        </p>

                    </div>

                </div>

                <div class="day-arrow">
                    →
                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    showDay(day);

                }
            );


            container.appendChild(
                card
            );

        }
    );

}


// ======================================
// POKAŻ DZIEŃ
// ======================================

function showDay(day) {

    document
        .getElementById(
            "daysView"
        )
        .style.display = "none";


    const details =
        document.getElementById(
            "dayDetails"
        );


    details.classList.add(
        "active"
    );


    document
        .getElementById(
            "detailDate"
        )
        .textContent =
            formatDate(day.date);


    renderLessons(
        day.lessons
    );


    renderMaterials(
        day.files
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


// ======================================
// WRÓĆ DO DNI
// ======================================

function showDays() {

    document
        .getElementById(
            "dayDetails"
        )
        .classList.remove(
            "active"
        );


    document
        .getElementById(
            "daysView"
        )
        .style.display =
            "block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


// ======================================
// LEKCJE
// ======================================

function renderLessons(
    lessons
) {

    const container =
        document.getElementById(
            "lessonList"
        );


    container.innerHTML = "";


    if (
        !Array.isArray(lessons) ||
        !lessons.length
    ) {

        container.innerHTML = `

            <div class="empty">

                Brak informacji
                o lekcjach.

            </div>

        `;

        return;

    }


    lessons.forEach(
        (lesson, index) => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "lesson";


            element.innerHTML = `

                <div class="lesson-number">

                    LEKCJA ${index + 1}

                </div>

                <h3>
                    ${escapeHtml(
                        lesson.subject ||
                        "Bez nazwy"
                    )}
                </h3>

                <p>
                    ${escapeHtml(
                        lesson.content ||
                        "Brak informacji."
                    )}
                </p>

            `;


            container.appendChild(
                element
            );

        }
    );

}


// ======================================
// MATERIAŁY
// ======================================

function renderMaterials(
    files
) {

    const section =
        document.getElementById(
            "materials"
        );


    const container =
        document.getElementById(
            "materialsList"
        );


    container.innerHTML = "";


    if (
        !Array.isArray(files) ||
        !files.length
    ) {

        section.style.display =
            "none";

        return;

    }


    section.style.display =
        "block";


    files.forEach(
        file => {

            const link =
                document.createElement(
                    "a"
                );


            link.className =
                "material";


            link.href =
                file.url;


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";


            link.textContent =
                `🔗 ${
                    file.name ||
                    "Materiał"
                }`;


            container.appendChild(
                link
            );

        }
    );

}


// ======================================
// FORMAT DATY
// ======================================

function formatDate(date) {

    const [
        year,
        month,
        day
    ] = date.split("-");


    const months = [

        "",
        "stycznia",
        "lutego",
        "marca",
        "kwietnia",
        "maja",
        "czerwca",
        "lipca",
        "sierpnia",
        "września",
        "października",
        "listopada",
        "grudnia"

    ];


    return `${Number(day)} ${
        months[Number(month)]
    } ${year}`;

}


// ======================================
// HTML ESCAPE
// ======================================

function escapeHtml(text) {

    return String(text ?? "")
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


</script>


</body>

</html>
