<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LEKCJE | Lista lekcji</title>

    <meta
        name="description"
        content="Lista lekcji i materiały ze szkoły."
    >

    <link
        rel="icon"
        type="image/png"
        href="Polak.png"
    >

    <link
        rel="stylesheet"
        href="style-lekcje.css"
    >

</head>

<body>

    <div class="background">
        <div class="background-glow"></div>
        <div class="grid"></div>
    </div>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="navbar">

        <a
            href="glowna.html"
            class="nav-logo"
        >
            LEKCJE
        </a>

        <button
            class="hamburger"
            id="hamburger"
            type="button"
            aria-label="Otwórz menu"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

        <div
            class="nav-menu"
            id="menu"
        >

            <a href="glowna.html">
                Strona główna
            </a>

            <a
                href="lekcje.html"
                class="active"
            >
                Lekcje
            </a>

            <a href="inne.html">
                Inne
            </a>

        </div>

    </nav>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="lessons-page">


        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="page-header">

            <h1>
                Lista lekcji.
            </h1>

            <p>
                Wszystkie zapisane lekcje i materiały.
            </p>

        </div>


        <!-- =================================================
             SORTOWANIE
        ================================================== -->

        <div class="sort-container">

            <div class="sort-label">
                Sortuj wg:
            </div>

            <div class="sort-wrapper">

                <button
                    class="sort-button"
                    id="sortButton"
                    type="button"
                >

                    <span id="sortCurrent">
                        Najnowsze
                    </span>

                    <span class="sort-arrow">
                        ▾
                    </span>

                </button>


                <div
                    class="sort-menu"
                    id="sortMenu"
                >

                    <button
                        type="button"
                        data-sort="newest"
                        class="selected"
                    >
                        Najnowsze
                    </button>

                    <button
                        type="button"
                        data-sort="oldest"
                    >
                        Najstarsze
                    </button>


                    <div
                        class="sort-months"
                        id="sortMonths"
                    ></div>

                </div>

            </div>

        </div>


        <!-- =================================================
             LISTA DNI
        ================================================== -->

        <section
            class="days-list"
            id="daysList"
        ></section>


        <!-- =================================================
             SZCZEGÓŁY DNIA
        ================================================== -->

        <section
            class="day-details"
            id="dayDetails"
            style="display: none;"
        >

            <button
                class="back-button"
                id="backButton"
                type="button"
            >
                ← Powrót
            </button>

            <div id="dayContent"></div>

        </section>

    </main>


    <!-- =====================================================
         IMAGE VIEWER
    ====================================================== -->

    <div
        class="image-viewer"
        id="imageViewer"
    >

        <button
            class="image-viewer-close"
            id="viewerClose"
            type="button"
            aria-label="Zamknij"
        >
            ×
        </button>


        <div
            class="image-viewer-counter"
            id="viewerCounter"
        >
            1 / 1
        </div>


        <button
            class="image-viewer-arrow image-viewer-prev"
            id="viewerPrev"
            type="button"
            aria-label="Poprzednie zdjęcie"
        >
            <
        </button>


        <img
            id="viewerImage"
            src=""
            alt=""
        >


        <button
            class="image-viewer-arrow image-viewer-next"
            id="viewerNext"
            type="button"
            aria-label="Następne zdjęcie"
        >
            >
        </button>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        <div class="footer-content">

            <div class="footer-logo">
                LEKCJE
            </div>

            <div class="footer-text">
                Materiały i informacje ze szkoły.
            </div>

        </div>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =================================================
           ZMIENNE
        ================================================= */

        let allDays = [];

        let currentSort = "newest";

        let currentDay = null;

        let currentImages = [];

        let currentImageIndex = 0;


        const MONTHS = [
            "",
            "STYCZEŃ",
            "LUTY",
            "MARZEC",
            "KWIECIEŃ",
            "MAJ",
            "CZERWIEC",
            "LIPIEC",
            "SIERPIEŃ",
            "WRZESIEŃ",
            "PAŹDZIERNIK",
            "LISTOPAD",
            "GRUDZIEŃ"
        ];


        /* =================================================
           ELEMENTY
        ================================================== */

        const daysList =
            document.getElementById("daysList");

        const dayDetails =
            document.getElementById("dayDetails");

        const dayContent =
            document.getElementById("dayContent");

        const backButton =
            document.getElementById("backButton");

        const sortContainer =
            document.querySelector(".sort-container");

        const sortButton =
            document.getElementById("sortButton");

        const sortCurrent =
            document.getElementById("sortCurrent");

        const sortMenu =
            document.getElementById("sortMenu");

        const sortMonths =
            document.getElementById("sortMonths");

        const imageViewer =
            document.getElementById("imageViewer");

        const viewerImage =
            document.getElementById("viewerImage");

        const viewerCounter =
            document.getElementById("viewerCounter");

        const viewerClose =
            document.getElementById("viewerClose");

        const viewerPrev =
            document.getElementById("viewerPrev");

        const viewerNext =
            document.getElementById("viewerNext");

        const hamburger =
            document.getElementById("hamburger");

        const menu =
            document.getElementById("menu");


        /* =================================================
           MENU MOBILNE
        ================================================== */

        hamburger.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();

                menu.classList.toggle("open");

            }
        );


        document.addEventListener(
            "click",
            (event) => {

                if (
                    !menu.contains(event.target) &&
                    !hamburger.contains(event.target)
                ) {

                    menu.classList.remove("open");

                }

            }
        );


        window.addEventListener(
            "resize",
            () => {

                if (window.innerWidth > 700) {

                    menu.classList.remove("open");

                }

            }
        );


        /* =================================================
           POBIERANIE LEKCJI
        ================================================== */

        async function loadLessons() {

            try {

                const response = await fetch(
                    "https://old-term-d35c.oliwierbielicki.workers.dev/lessons"
                );


                if (!response.ok) {

                    throw new Error(
                        "Nie udało się pobrać danych."
                    );

                }


                const data =
                    await response.json();


                if (!Array.isArray(data)) {

                    throw new Error(
                        "Nieprawidłowy format danych."
                    );

                }


                allDays = data;


                /*
                    Sortowanie głównej tablicy.

                    Nie filtrujemy tutaj tablicy,
                    ponieważ allDays musi zawsze
                    zawierać wszystkie lekcje.
                */

                allDays.sort(
                    (a, b) =>
                        new Date(b.date) -
                        new Date(a.date)
                );


                /*
                    Tworzenie listy miesięcy
                */

                generateMonthOptions();


                /*
                    Domyślne sortowanie
                */

                currentSort = "newest";

                sortCurrent.textContent =
                    "Najnowsze";


                document
                    .querySelectorAll(
                        "#sortMenu button"
                    )
                    .forEach(button => {

                        button.classList.remove(
                            "selected"
                        );

                    });


                const newestButton =
                    document.querySelector(
                        '#sortMenu button[data-sort="newest"]'
                    );


                if (newestButton) {

                    newestButton.classList.add(
                        "selected"
                    );

                }


                applySort();


            } catch (error) {

                console.error(error);


                daysList.innerHTML = `

                    <div class="error-message">

                        <h2>
                            Nie udało się wczytać lekcji.
                        </h2>

                        <p>
                            Spróbuj odświeżyć stronę.
                        </p>

                    </div>

                `;

            }

        }


        /* =================================================
           GENEROWANIE MIESIĘCY
        ================================================== */

        function generateMonthOptions() {

            sortMonths.innerHTML = "";


            const months =
                new Map();


            allDays.forEach(
                day => {

                    if (!day.date) {
                        return;
                    }


                    const date =
                        new Date(day.date);


                    if (isNaN(date.getTime())) {
                        return;
                    }


                    const year =
                        date.getFullYear();


                    const month =
                        date.getMonth() + 1;


                    const key =
                        `${year}-${String(month).padStart(2, "0")}`;


                    months.set(
                        key,
                        {
                            year,
                            month
                        }
                    );

                }
            );


            const sortedMonths =
                Array
                    .from(months.values())
                    .sort(
                        (a, b) => {

                            if (
                                a.year !== b.year
                            ) {

                                return (
                                    b.year -
                                    a.year
                                );

                            }


                            return (
                                b.month -
                                a.month
                            );

                        }
                    );


            sortedMonths.forEach(
                item => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type = "button";


                    button.dataset.sort =
                        "month";


                    button.dataset.year =
                        item.year;


                    button.dataset.month =
                        item.month;


                    button.textContent =
                        `${MONTHS[item.month]} ${item.year}`;


                    sortMonths.appendChild(
                        button
                    );

                }
            );

        }


        /* =================================================
           SORTOWANIE
        ================================================== */

        function applySort() {

            /*
                Zawsze robimy kopię.

                Dzięki temu wybranie miesiąca
                NIE usuwa pozostałych lekcji.
            */

            let days =
                [...allDays];


            /* ---------------------------------------------
               NAJNOWSZE
            --------------------------------------------- */

            if (
                currentSort === "newest"
            ) {

                days.sort(
                    (a, b) =>
                        new Date(b.date) -
                        new Date(a.date)
                );

            }


            /* ---------------------------------------------
               NAJSTARSZE
            --------------------------------------------- */

            else if (
                currentSort === "oldest"
            ) {

                days.sort(
                    (a, b) =>
                        new Date(a.date) -
                        new Date(b.date)
                );

            }


            /* ---------------------------------------------
               KONKRETNY MIESIĄC
            --------------------------------------------- */

            else if (
                currentSort.startsWith(
                    "month:"
                )
            ) {

                const parts =
                    currentSort.split(":");


                const year =
                    Number(parts[1]);


                const month =
                    Number(parts[2]);


                days =
                    days.filter(
                        day => {

                            const date =
                                new Date(
                                    day.date
                                );


                            return (
                                date.getFullYear() ===
                                    year &&
                                date.getMonth() + 1 ===
                                    month
                            );

                        }
                    );


                days.sort(
                    (a, b) =>
                        new Date(b.date) -
                        new Date(a.date)
                );

            }


            renderDays(days);

        }


        /* =================================================
           OTWIERANIE MENU SORTOWANIA
        ================================================== */

        sortButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                sortMenu.classList.toggle(
                    "open"
                );

            }
        );


        document.addEventListener(
            "click",
            event => {

                if (
                    !sortMenu.contains(
                        event.target
                    ) &&
                    !sortButton.contains(
                        event.target
                    )
                ) {

                    sortMenu.classList.remove(
                        "open"
                    );

                }

            }
        );


        /* =================================================
           PRZYCISKI SORTOWANIA
        ================================================== */

        sortMenu.addEventListener(
            "click",
            event => {

                const button =
                    event.target.closest(
                        "button"
                    );


                if (!button) {
                    return;
                }


                const sort =
                    button.dataset.sort;


                /* -----------------------------------------
                   NAJNOWSZE / NAJSTARSZE
                ----------------------------------------- */

                if (
                    sort === "newest" ||
                    sort === "oldest"
                ) {

                    currentSort =
                        sort;


                    if (
                        sort === "newest"
                    ) {

                        sortCurrent.textContent =
                            "Najnowsze";

                    }

                    else {

                        sortCurrent.textContent =
                            "Najstarsze";

                    }


                    document
                        .querySelectorAll(
                            "#sortMenu button"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                    button.classList.add(
                        "selected"
                    );


                    sortMenu.classList.remove(
                        "open"
                    );


                    applySort();


                    return;

                }


                /* -----------------------------------------
                   MIESIĄC
                ----------------------------------------- */

                if (
                    sort === "month"
                ) {

                    const year =
                        Number(
                            button.dataset.year
                        );


                    const month =
                        Number(
                            button.dataset.month
                        );


                    currentSort =
                        `month:${year}:${month}`;


                    sortCurrent.textContent =
                        `${MONTHS[month]} ${year}`;


                    document
                        .querySelectorAll(
                            "#sortMenu button"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                    button.classList.add(
                        "selected"
                    );


                    sortMenu.classList.remove(
                        "open"
                    );


                    applySort();

                }

            }
        );


        /* =================================================
           RENDEROWANIE LISTY DNI
        ================================================== */

        function renderDays(
            days = allDays
        ) {

            daysList.innerHTML = "";


            if (
                !days ||
                days.length === 0
            ) {

                daysList.innerHTML = `

                    <div class="empty-message">

                        <h2>
                            Brak lekcji
                        </h2>

                        <p>
                            Nie znaleziono lekcji dla wybranego okresu.
                        </p>

                    </div>

                `;


                return;

            }


            let previousMonthKey =
                null;


            days.forEach(
                day => {

                    const date =
                        new Date(day.date);


                    if (
                        isNaN(
                            date.getTime()
                        )
                    ) {

                        return;

                    }


                    const year =
                        date.getFullYear();


                    const month =
                        date.getMonth() + 1;


                    /*
                        Rok + miesiąc.

                        Dzięki temu np. STYCZEŃ 2026
                        i STYCZEŃ 2027 są osobnymi sekcjami.
                    */

                    const monthKey =
                        `${year}-${month}`;


                    if (
                        monthKey !==
                        previousMonthKey
                    ) {

                        const monthTitle =
                            document.createElement(
                                "div"
                            );


                        monthTitle.className =
                            "month-separator";


                        monthTitle.innerHTML = `

                            <span>
                                ${MONTHS[month]}
                            </span>

                            <span>
                                ${year}
                            </span>

                        `;


                        daysList.appendChild(
                            monthTitle
                        );


                        previousMonthKey =
                            monthKey;

                    }


                    const dayCard =
                        document.createElement(
                            "button"
                        );


                    dayCard.type =
                        "button";


                    dayCard.className =
                        "day-card";


                    const weekday =
                        date.toLocaleDateString(
                            "pl-PL",
                            {
                                weekday:
                                    "long"
                            }
                        );


                    const formattedDate =
                        date.toLocaleDateString(
                            "pl-PL",
                            {
                                day:
                                    "numeric",

                                month:
                                    "long",

                                year:
                                    "numeric"
                            }
                        );


                    const lessonCount =
                        Array.isArray(
                            day.lessons
                        )
                            ? day.lessons.length
                            : 0;


                    const fileCount =
                        Array.isArray(
                            day.files
                        )
                            ? day.files.length
                            : 0;


                    dayCard.innerHTML = `

                        <div class="day-card-date">

                            <span class="day-number">
                                ${date.getDate()}
                            </span>

                            <span class="day-month">
                                ${MONTHS[month]}
                            </span>

                        </div>


                        <div class="day-card-info">

                            <div class="day-card-weekday">
                                ${capitalize(
                                    weekday
                                )}
                            </div>

                            <div class="day-card-full-date">
                                ${formattedDate}
                            </div>

                        </div>


                        <div class="day-card-count">

                            <span>
                                ${lessonCount}
                                ${
                                    lessonCount === 1
                                        ? "lekcja"
                                        : lessonCount >= 2 &&
                                          lessonCount <= 4
                                            ? "lekcje"
                                            : "lekcji"
                                }
                            </span>

                            ${
                                fileCount > 0
                                    ? `
                                        <span>
                                            ${fileCount}
                                            ${
                                                fileCount === 1
                                                    ? "materiał"
                                                    : fileCount >= 2 &&
                                                      fileCount <= 4
                                                        ? "materiały"
                                                        : "materiałów"
                                            }
                                        </span>
                                    `
                                    : ""
                            }

                        </div>

                    `;


                    dayCard.addEventListener(
                        "click",
                        () => {

                            showDay(day);

                        }
                    );


                    daysList.appendChild(
                        dayCard
                    );

                }
            );

        }


        /* =================================================
           OTWIERANIE KONKRETNEGO DNIA
        ================================================== */

        function showDay(day) {

            currentDay =
                day;


            /*
                UKRYWAMY:
                - listę dni
                - sortowanie
            */

            daysList.style.display =
                "none";


            sortContainer.style.display =
                "none";


            /*
                Pokazujemy szczegóły.
            */

            dayDetails.style.display =
                "block";


            /*
                Zamykamy menu sortowania,
                gdyby było otwarte.
            */

            sortMenu.classList.remove(
                "open"
            );


            /*
                Scroll na początek strony.
            */

            window.scrollTo(
                {
                    top: 0,
                    behavior: "smooth"
                }
            );


            const date =
                new Date(day.date);


            const weekday =
                date.toLocaleDateString(
                    "pl-PL",
                    {
                        weekday:
                            "long"
                    }
                );


            const formattedDate =
                date.toLocaleDateString(
                    "pl-PL",
                    {
                        day:
                            "numeric",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );


            dayContent.innerHTML = `

                <div class="day-detail-header">

                    <div class="day-detail-date">

                        ${formattedDate}

                    </div>


                    <h1>

                        ${capitalize(
                            weekday
                        )}

                    </h1>

                </div>


                <div
                    class="lessons-container"
                    id="lessonsContainer"
                ></div>


                <div
                    class="materials-container"
                    id="materialsContainer"
                ></div>

            `;


            renderLessons(
                day.lessons
            );


            renderMaterials(
                day.files
            );

        }


        /* =================================================
           RENDEROWANIE LEKCJI
        ================================================== */

        function renderLessons(
            lessons
        ) {

            const container =
                document.getElementById(
                    "lessonsContainer"
                );


            if (
                !Array.isArray(
                    lessons
                ) ||
                lessons.length === 0
            ) {

                container.innerHTML = `

                    <div class="no-lessons">
                        Brak zapisanych lekcji.
                    </div>

                `;


                return;

            }


            container.innerHTML = `

                <div class="section-title">
                    Lekcje
                </div>

            `;


            lessons.forEach(
                (lesson, index) => {

                    const lessonCard =
                        document.createElement(
                            "article"
                        );


                    lessonCard.className =
                        "lesson-card";


                    /*
                        Obsługujemy różne możliwe
                        nazwy pól z API.
                    */

                    const title =
                        lesson.title ||
                        lesson.name ||
                        `Lekcja ${index + 1}`;


                    const subject =
                        lesson.subject ||
                        lesson.przedmiot ||
                        "";


                    const teacher =
                        lesson.teacher ||
                        lesson.nauczyciel ||
                        "";


                    const content =
                        lesson.content ||
                        lesson.description ||
                        lesson.opis ||
                        lesson.text ||
                        "";


                    lessonCard.innerHTML = `

                        <div class="lesson-number">

                            ${index + 1}

                        </div>


                        <div class="lesson-content">

                            ${
                                subject
                                    ? `
                                        <div class="lesson-subject">
                                            ${escapeHTML(
                                                subject
                                            )}
                                        </div>
                                    `
                                    : ""
                            }


                            <h2>

                                ${escapeHTML(
                                    title
                                )}

                            </h2>


                            ${
                                teacher
                                    ? `
                                        <div class="lesson-teacher">
                                            ${escapeHTML(
                                                teacher
                                            )}
                                        </div>
                                    `
                                    : ""
                            }


                            ${
                                content
                                    ? `
                                        <div class="lesson-description">
                                            ${formatText(
                                                content
                                            )}
                                        </div>
                                    `
                                    : ""
                            }

                        </div>

                    `;


                    container.appendChild(
                        lessonCard
                    );

                }
            );

        }


        /* =================================================
           MATERIAŁY / ZAŁĄCZNIKI
        ================================================== */

        function renderMaterials(
            files
        ) {

            const container =
                document.getElementById(
                    "materialsContainer"
                );


            if (
                !Array.isArray(
                    files
                ) ||
                files.length === 0
            ) {

                container.style.display =
                    "none";


                return;

            }


            container.style.display =
                "block";


            container.innerHTML = `

                <div class="section-title">
                    Materiały
                </div>

                <div
                    class="materials-list"
                    id="materialsList"
                ></div>

                <div
                    class="materials-gallery"
                    id="materialsGallery"
                ></div>

            `;


            const materialsList =
                document.getElementById(
                    "materialsList"
                );


            const materialsGallery =
                document.getElementById(
                    "materialsGallery"
                );


            const images = [];


            files.forEach(
                (file, index) => {

                    /*
                        Obsługujemy string albo obiekt.
                    */

                    let url = "";

                    let name =
                        `Materiał ${index + 1}`;


                    if (
                        typeof file ===
                        "string"
                    ) {

                        url =
                            file;

                    }

                    else if (
                        file &&
                        typeof file ===
                        "object"
                    ) {

                        url =
                            file.url ||
                            file.src ||
                            file.link ||
                            file.path ||
                            "";


                        name =
                            file.name ||
                            file.filename ||
                            file.title ||
                            name;

                    }


                    if (!url) {
                        return;
                    }


                    const lowerUrl =
                        url.toLowerCase();


                    const isImage =
                        lowerUrl.includes(
                            ".jpg"
                        ) ||
                        lowerUrl.includes(
                            ".jpeg"
                        ) ||
                        lowerUrl.includes(
                            ".png"
                        ) ||
                        lowerUrl.includes(
                            ".webp"
                        ) ||
                        lowerUrl.includes(
                            ".gif"
                        ) ||
                        lowerUrl.includes(
                            ".avif"
                        );


                    if (isImage) {

                        const imageIndex =
                            images.length;


                        images.push(
                            {
                                url,
                                name
                            }
                        );


                        const imageCard =
                            document.createElement(
                                "button"
                            );


                        imageCard.type =
                            "button";


                        imageCard.className =
                            "material-image";


                        imageCard.innerHTML = `

                            <img
                                src="${escapeAttribute(
                                    url
                                )}"
                                alt="${escapeAttribute(
                                    name
                                )}"
                                loading="lazy"
                            >

                        `;


                        imageCard.addEventListener(
                            "click",
                            () => {

                                openImageViewer(
                                    images,
                                    imageIndex
                                );

                            }
                        );


                        materialsGallery.appendChild(
                            imageCard
                        );

                    }

                    else {

                        const link =
                            document.createElement(
                                "a"
                            );


                        link.className =
                            "material-link";


                        link.href =
                            url;


                        link.target =
                            "_blank";


                        link.rel =
                            "noopener noreferrer";


                        link.textContent =
                            name;


                        materialsList.appendChild(
                            link
                        );

                    }

                }
            );


            /*
                Jeśli nie ma zwykłych plików,
                chowamy listę.
            */

            if (
                materialsList.children.length ===
                0
            ) {

                materialsList.style.display =
                    "none";

            }

        }


        /* =================================================
           IMAGE VIEWER
        ================================================== */

        function openImageViewer(
            images,
            index
        ) {

            if (
                !images ||
                images.length === 0
            ) {

                return;

            }


            currentImages =
                images;


            currentImageIndex =
                index;


            updateImageViewer();


            imageViewer.classList.add(
                "open"
            );


            document.body.classList.add(
                "viewer-open"
            );

        }


        function updateImageViewer() {

            if (
                !currentImages ||
                currentImages.length === 0
            ) {

                return;

            }


            const image =
                currentImages[
                    currentImageIndex
                ];


            viewerImage.src =
                image.url;


            viewerImage.alt =
                image.name || "";


            viewerCounter.textContent =
                `${currentImageIndex + 1} / ${currentImages.length}`;


            /*
                Przy jednym zdjęciu ukrywamy
                przyciski nawigacji.
            */

            if (
                currentImages.length <= 1
            ) {

                viewerPrev.style.display =
                    "none";

                viewerNext.style.display =
                    "none";

            }

            else {

                viewerPrev.style.display =
                    "";

                viewerNext.style.display =
                    "";

            }

        }


        function closeImageViewer() {

            imageViewer.classList.remove(
                "open"
            );


            document.body.classList.remove(
                "viewer-open"
            );


            viewerImage.src =
                "";


            currentImages =
                [];


            currentImageIndex =
                0;

        }


        function previousImage() {

            if (
                currentImages.length <= 1
            ) {

                return;

            }


            currentImageIndex--;

            
            if (
                currentImageIndex < 0
            ) {

                currentImageIndex =
                    currentImages.length - 1;

            }


            updateImageViewer();

        }


        function nextImage() {

            if (
                currentImages.length <= 1
            ) {

                return;

            }


            currentImageIndex++;


            if (
                currentImageIndex >=
                currentImages.length
            ) {

                currentImageIndex =
                    0;

            }


            updateImageViewer();

        }


        /* =================================================
           PRZYCISKI GALERII
        ================================================== */

        viewerClose.addEventListener(
            "click",
            closeImageViewer
        );


        viewerPrev.addEventListener(
            "click",
            previousImage
        );


        viewerNext.addEventListener(
            "click",
            nextImage
        );


        imageViewer.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    imageViewer
                ) {

                    closeImageViewer();

                }

            }
        );


        /* =================================================
           KLAWIATURA
        ================================================== */

        document.addEventListener(
            "keydown",
            event => {

                /*
                    ESC - zamykanie galerii
                */

                if (
                    event.key === "Escape"
                ) {

                    if (
                        imageViewer.classList.contains(
                            "open"
                        )
                    ) {

                        closeImageViewer();

                    }

                }


                /*
                    Lewa strzałka
                */

                if (
                    event.key === "ArrowLeft"
                ) {

                    if (
                        imageViewer.classList.contains(
                            "open"
                        )
                    ) {

                        previousImage();

                    }

                }


                /*
                    Prawa strzałka
                */

                if (
                    event.key === "ArrowRight"
                ) {

                    if (
                        imageViewer.classList.contains(
                            "open"
                        )
                    ) {

                        nextImage();

                    }

                }

            }
        );


        /* =================================================
           POWRÓT DO LISTY
        ================================================== */

        backButton.addEventListener(
            "click",
            () => {

                /*
                    Zamykamy szczegóły.
                */

                dayDetails.style.display =
                    "none";


                /*
                    Pokazujemy listę dni.
                */

                daysList.style.display =
                    "";


                /*
                    POKAZUJEMY PONOWNIE
                    "SORTUJ WG"
                */

                sortContainer.style.display =
                    "";


                /*
                    Przywracamy listę z aktualnym
                    sortowaniem.
                */

                applySort();


                /*
                    Scroll na początek.
                */

                window.scrollTo(
                    {
                        top: 0,
                        behavior: "smooth"
                    }
                );


                currentDay =
                    null;

            }
        );


        /* =================================================
           FUNKCJE POMOCNICZE
        ================================================== */

        function capitalize(
            text
        ) {

            if (!text) {
                return "";
            }


            return (
                text.charAt(0).toUpperCase() +
                text.slice(1)
            );

        }


        function escapeHTML(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


        function escapeAttribute(
            value
        ) {

            return escapeHTML(
                value
            );

        }


        function formatText(
            text
        ) {

            return escapeHTML(
                text
            )
                .replaceAll(
                    "\n",
                    "<br>"
                );

        }


        /* =================================================
           START
        ================================================== */

        loadLessons();

    </script>

</body>
